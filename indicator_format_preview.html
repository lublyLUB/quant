<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>19개 지표 표기 방식 미리보기 (예시)</title>
<style>
    body { font-family: -apple-system, sans-serif; background:#f8fafc; padding:16px; color:#333; }
    .container { max-width: 720px; margin:0 auto; background:#fff; border-radius:12px; padding:16px; box-shadow:0 4px 10px rgba(0,0,0,0.05); }
    h1 { font-size:16px; color:#1e3a8a; text-align:center; }
    .note { font-size:11px; color:#94a3b8; text-align:center; margin-bottom:14px; }
    .mode-toggle { text-align:center; margin-bottom:14px; }
    .mode-toggle button { font-size:12px; font-weight:bold; padding:6px 14px; border:1px solid #cbd5e1; background:#f1f5f9; cursor:pointer; border-radius:6px; margin:0 3px; }
    .mode-toggle button.active { background:#1e3a8a; color:#fff; border-color:#1e3a8a; }
    table { width:100%; border-collapse:collapse; font-size:12px; }
    th, td { padding:8px 6px; border-bottom:1px solid #e2e8f0; text-align:center; vertical-align:middle; }
    th { background:#f8fafc; color:#475569; font-size:11px; }
    td.name { text-align:left; font-weight:bold; color:#1e3a8a; }
    .simple-value { font-weight:bold; color:#059669; font-size:13px; }

    /* 자세히 모드: 분수 한 칸 = [라벨(헤더 역할)] / [숫자(값)] 을 분자·분모 두 단으로 쌓는다 */
    .fraction { display:inline-flex; flex-direction:column; align-items:center; line-height:1.2; }
    .frac-part { display:flex; flex-direction:column; align-items:center; margin:0 6px; }
    .flabel { font-size:8.5px; color:#94a3b8; font-weight:normal; }
    .fvalue { font-size:12px; font-weight:bold; color:#1e293b; }
    .fbar { width:90%; border-top:1px solid #475569; margin:2px 0; }
    .frac-op { font-size:11px; color:#94a3b8; margin:0 2px; }

    .detail-row { display:none; }
    .mode-detail .detail-row { display:flex; justify-content:center; align-items:center; flex-wrap:wrap; }
    .mode-detail .simple-row { display:none; }
    .mode-simple .detail-row { display:none; }
    .mode-simple .simple-row { display:block; }
</style>
</head>
<body>
<div class="container">
    <h1>19개 지표 표기 방식 미리보기</h1>
    <div class="note">예시 수치이며 실제 데이터와 무관합니다 (단위: 억원, 비율은 %)</div>
    <div class="mode-toggle">
        <button id="btn-simple" class="active" onclick="setMode('simple')">간단</button>
        <button id="btn-detail" onclick="setMode('detail')">자세히</button>
    </div>
    <table id="indicator-table"></table>
</div>

<script>
// part(label, value): 라벨(헤더처럼 작고 흐리게) + 값(숫자, 굵게)을 한 단으로
function part(label, value) {
    return `<span class="frac-part"><span class="flabel">${label}</span><span class="fvalue">${value}</span></span>`;
}
// frac(분자 part, 분모 part): 두 단을 가로선으로 분리해 쌓기
function frac(numPart, denomPart) {
    return `<span class="fraction">${numPart}<span class="fbar"></span>${denomPart}</span>`;
}
// 한 단만 있는 단순 표기 (분수가 아닌 지표용)
function single(label, value) {
    return `<span class="frac-part">${part(label, value)}</span>`;
}

const INDICATORS = [
    { no: 1, name: 'PER', simple: '15.3',
      detail: frac(part('시가총액', '765,000'), part('최신분기 순이익', '50,000')) },
    { no: 2, name: 'PCR', simple: '9.6',
      detail: frac(part('시가총액', '765,000'), part('최신분기 영업CF', '80,000')) },
    { no: 3, name: 'PFCR', simple: '12.8',
      detail: frac(part('시가총액', '765,000'), part('영업CF − CapEx', '80,000 − 20,000')) },
    { no: 4, name: 'PBR', simple: '0.85',
      detail: frac(part('시가총액', '765,000'), part('자본총계', '900,000')) },
    { no: 5, name: 'PSR', simple: '2.55',
      detail: frac(part('시가총액', '765,000'), part('최신분기 매출액', '300,000')) },
    { no: 6, name: 'GP/A', simple: '18.2%',
      detail: frac(part('매출 − 매출원가', '300,000 − 150,000'), part('자산총계', '823,000')) },
    { no: 7, name: '신F-스코어', simple: '3점',
      detail: part('유상증자 여부', 'X') + part('순이익', '47,000') + part('영업CF', '80,000') },
    { no: 8, name: '영업이익/차입금 증가율(YoY)', simple: '+45.2%',
      detail: frac(part('영업이익 ÷ 차입금 (당기)', '57,000 ÷ 26,900'), part('영업이익 ÷ 차입금 (전년동기)', '6,700 ÷ 9,100')) },
    { no: 9, name: '자산성장률(YoY)', simple: '+22.6%',
      detail: frac(part('자산총계 − 전년동기', '823,000 − 671,000'), part('전년동기 자산총계', '671,000')) },
    { no: 10, name: '주가 변동성', simple: '8.4%',
      detail: single('최근 12개월 월간수익률 표준편차', '8.4%') },
    { no: 11, name: '영업이익 QoQ', simple: '+185.1%',
      detail: frac(part('영업이익 − 전분기', '57,000 − 20,000'), part('전분기 영업이익', '20,000')) },
    { no: 12, name: '영업이익 YoY', simple: '+756.1%',
      detail: frac(part('영업이익 − 전년동기', '57,000 − 6,700'), part('전년동기 영업이익', '6,700')) },
    { no: 13, name: '순이익 QoQ', simple: '+140.4%',
      detail: frac(part('순이익 − 전분기', '47,000 − 19,600'), part('전분기 순이익', '19,600')) },
    { no: 14, name: '순이익 YoY', simple: '+474.3%',
      detail: frac(part('순이익 − 전년동기', '47,000 − 8,200'), part('전년동기 순이익', '8,200')) },
    { no: 15, name: '유동자산−총부채 > 시가총액', simple: '충족 (O)',
      detail: frac(part('유동자산 − 총부채', '306,000 − 146,700'), part('시가총액', '765,000')) },
    { no: 16, name: '분기 순이익', simple: '47,000억',
      detail: single('분기 순이익(원본값)', '47,000') },
    { no: 17, name: '차입금비율', simple: '3.0%',
      detail: frac(part('차입금', '26,900'), part('자본총계', '900,000')) },
    { no: 18, name: '유동비율', simple: '253.9%',
      detail: frac(part('유동자산', '306,000'), part('유동부채', '120,600')) },
    { no: 19, name: '배당율', simple: '1.3%',
      detail: frac(part('연간 배당금', '9,900'), part('시가총액', '765,000')) },
];

function render() {
    let html = `<thead><tr><th style="width:8%;">#</th><th style="width:26%;">지표</th><th style="width:66%;">값</th></tr></thead><tbody>`;
    INDICATORS.forEach(item => {
        html += `<tr>
            <td>${item.no}</td>
            <td class="name">${item.name}</td>
            <td>
                <div class="simple-row"><span class="simple-value">${item.simple}</span></div>
                <div class="detail-row">${item.detail}</div>
            </td>
        </tr>`;
    });
    html += `</tbody>`;
    document.getElementById('indicator-table').innerHTML = html;
}

function setMode(mode) {
    document.getElementById('indicator-table').className = `mode-${mode}`;
    document.getElementById('btn-simple').classList.toggle('active', mode === 'simple');
    document.getElementById('btn-detail').classList.toggle('active', mode === 'detail');
}

render();
setMode('simple');
</script>
</body>
</html>

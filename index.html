<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바이브 프로 퀀트 플랫폼</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --positive: #ef4444;
            --negative: #3b82f6;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
        }
        .header {
            margin-bottom: 24px;
            border-bottom: 1px solid #334155;
            padding-bottom: 12px;
        }
        h1 { font-size: 20px; margin: 0 0 4px 0; color: var(--accent-color); }
        .timestamp { font-size: 12px; color: var(--text-muted); }
        .table-container {
            background: var(--card-bg);
            border-radius: 8px;
            overflow-x: auto;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            text-align: left;
        }
        th, td { padding: 12px; border-bottom: 1px solid #334155; white-space: nowrap; }
        th { background-color: #111827; color: var(--text-muted); font-weight: 600; }
        tr:last-child td { border-bottom: none; }
        .rank { font-weight: bold; color: var(--accent-color); text-align: center; width: 40px; }
        .up { color: var(--positive); }
        .down { color: var(--negative); }
    </style>
</head>
<body>

    <div class="header">
        <h1>📊 바이브 프로 퀀트 매트릭스</h1>
        <div class="timestamp" id="update-time">데이터 로딩 중...</div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="text-align: center;">순위</th>
                    <th>종목명</th>
                    <th style="text-align: right;">현재가</th>
                    <th style="text-align: right;">등락률</th>
                    <th style="text-align: right;">PER</th>
                    <th style="text-align: right;">PBR</th>
                </tr>
            </thead>
            <tbody id="quant-table-body">
                </tbody>
        </table>
    </div>

    <script src="data.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 1. 업데이트 시각 반영
            if (typeof lastUpdated !== 'undefined') {
                document.getElementById("update-time").innerText = "시스템 최종 동기화: " + lastUpdated;
            } else {
                document.getElementById("update-time").innerText = "데이터 선로 오류 (data.js를 확인하세요)";
                return;
            }

            // 2. 퀀트 알고리즘 연산 (필터링 및 멀티 팩터 랭킹 매트릭스)
            if (typeof quantData !== 'undefined' && quantData.length > 0) {
                
                // [필터링 및 스코어링] PER과 PBR이 0보다 큰 정상 가치주만 엄선
                let validStocks = quantData.filter(stock => stock.per > 0 && stock.pbr > 0);

                // PER 순위 매기기 (오름차순)
                validStocks.sort((a, b) => a.per - b.per);
                validStocks.forEach((stock, index) => { stock.perRank = index + 1; });

                // PBR 순위 매기기 (오름차순)
                validStocks.sort((a, b) => a.pbr - b.pbr);
                validStocks.forEach((stock, index) => { stock.pbrRank = index + 1; });

                // 종합 점수 계산 (PER 순위 + PBR 순위) 및 최종 정렬
                validStocks.forEach(stock => {
                    stock.totalScore = stock.perRank + stock.pbrRank;
                });
                validStocks.sort((a, b) => a.totalScore - b.totalScore);

                // 최상위 가치 우량주 Top 15 추출 및 렌더링
                const topStocks = validStocks.slice(0, 15);
                const tableBody = document.getElementById("quant-table-body");
                tableBody.innerHTML = "";

                topStocks.forEach((stock, index) => {
                    const fltRt = stock.fltRt;
                    const fltClass = fltRt > 0 ? "up" : (fltRt < 0 ? "down" : "");
                    const fltSign = fltRt > 0 ? "+" : "";

                    const row = `
                        <tr>
                            <td class="rank">${index + 1}</td>
                            <td style="font-weight: 500;">${stock.name}</td>
                            <td style="text-align: right;">${stock.close.toLocaleString()}원</td>
                            <td style="text-align: right;" class="${fltClass}">${fltSign}${fltRt.toFixed(2)}%</td>
                            <td style="text-align: right; color: #e2e8f0;">${stock.per.toFixed(2)}</td>
                            <td style="text-align: right; color: #e2e8f0;">${stock.pbr.toFixed(2)}</td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            } else {
                document.getElementById("quant-table-body").innerHTML = `
                    <tr>
                        <td colspan="6" style="text-align: center; padding: 40px; color: var(--text-muted);">
                            수집된 주가 데이터가 없거나 점검 중입니다.
                        </td>
                    </tr>
                `;
            }
        });
    </script>
</body>
</html>

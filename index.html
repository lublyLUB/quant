    function computeAddOrderData() {
        const summaryEl = document.getElementById('addorder-summary');
        if (!summaryEl) return [];
        if (!holdingsLoaded) {
            summaryEl.innerHTML = '<span style="color:#94a3b8;">⏳ 보유 내역 조회 중...</span>';
            setAddOrderConfirmBtn(false);
            return [];
        }
        setAddOrderConfirmBtn(true);
        if (portfolioNames.length === 0) {
            summaryEl.textContent = '포트폴리오 설정에서 종목을 먼저 확정해 주세요.';
            return [];
        }
        const N = portfolioNames.length;
        const recommendList = computeRecommendData();
        const rankByName = new Map(recommendList.map(r => [r.name, r.rank]));

        // 투자 가능 총액 = 보유내역 총자산 + 추가 투자금
        const addInvestInput = document.getElementById('additional-investment-input');
        const addInvest = addInvestInput ? (parseFloat((addInvestInput.value || '').replace(/,/g, '')) || 0) : 0;
        const totalAsset = (holdingsAccountInfo ? holdingsAccountInfo.totalAsset : portfolioBaseAmount) + addInvest;

        // 전체 종목 평가액 먼저 계산
        const allRows = portfolioNames.map(name => {
            const rank = rankByName.has(name) ? rankByName.get(name) : Infinity;
            const code = findStockCode(name);
            const freshPrice = code ? freshPriceByCode[code] : null;
            const held = code ? holdingsByCode[code] : null;
            const price = freshPrice != null ? freshPrice : (held ? held.price : findStockPrice(name));
            const heldQty = held ? held.qty : 0;
            const heldValue = price ? heldQty * price : 0;
            return { name, rank, code, price, heldQty, heldValue };
        });

        // 순위 밖(rank > N) 종목의 평가액은 추가 투자 대상에서 제외 → 목표 계산 시 차감
        const excludedValue = allRows
            .filter(s => s.rank > N)
            .reduce((sum, s) => sum + s.heldValue, 0);

        // 순위 이내 종목만 균등 배분 (순위 밖 평가액 제외 후 N등분)
        const targetPerStock = (totalAsset - excludedValue) / N;

        // 종목별 현재 평가금액, 비중 부족분 계산 (순위 ≤ N인 종목만)
        const rows = allRows.filter(s => s.rank <= N && s.price);

        if (rows.length === 0) {
            summaryEl.innerHTML = `⚠️ 추천 순위 ${N}위 이내 종목이 없습니다. (보유 내역을 조회해 주세요)`;
            return [];
        }

        // 비중 부족분 계산
        rows.forEach(s => {
            const shortage = targetPerStock - s.heldValue;
            s.shortage = shortage;
        });

        const availableCash = holdingsAccountInfo ? (holdingsAccountInfo.ordAlowa || holdingsAccountInfo.cash) : 0;
        const totalAvailable = availableCash + addInvest;

        // 부족분 큰 종목부터 1주씩 채워가는 탐욕적 배분
        // (부족분이 음수여도 가장 덜 초과된 종목 우선 — 모든 종목이 목표 초과인 경우도 처리)
        rows.forEach(s => { s.buyQty = 0; });
        let remaining = totalAvailable;
        while (remaining > 0) {
            let best = null;
            let bestEff = -Infinity;
            for (const s of rows) {
                if (s.price > remaining) continue;
                const eff = targetPerStock - s.heldValue - s.buyQty * s.price;
                if (eff > bestEff) { bestEff = eff; best = s; }
            }
            if (!best) break;
            best.buyQty += 1;
            remaining -= best.price;
        }
        rows.forEach(s => { s.buyAmt = s.buyQty * s.price; });
        let totalBuyAmt = rows.reduce((sum, s) => sum + s.buyAmt, 0);

        const chip = (label, value, color) => `<span class="summary-chip"><span class="summary-chip-label">${label}</span><span class="summary-chip-value"${color ? ` style="color:${color};"` : ''}>${value}</span></span>`;
        const eligibleCount = rows.filter(s => s.buyQty > 0).length;
        const prftRt = holdingsAccountInfo ? holdingsAccountInfo.totalPrftRt : null;
        const prftRtColor = prftRt != null ? (prftRt > 0 ? '#dc2626' : prftRt < 0 ? '#2563eb' : '#64748b') : '';
        const dep2 = holdingsAccountInfo ? holdingsAccountInfo.depositInfo : null;
        summaryEl.innerHTML = `
            <div style="margin-bottom:6px;">
                <span class="summary-chips" style="margin-top:0; margin-bottom:4px;">
                    ${holdingsAccountInfo ? chip('총자산', `${formatNumber(holdingsAccountInfo.totalAsset)}원`) : ''}
                    ${prftRt != null ? chip('수익률', `<span style="color:${prftRtColor};font-weight:700;">${prftRt >= 0 ? '+' : ''}${prftRt.toFixed(2)}%</span>`) : ''}
                    ${dep2 ? chip('주문가능', `${formatNumber(dep2.ordAlow)}원`) : ''}
                </span>
                <span class="summary-chips" style="margin-top:0;">
                    ${chip('대상 종목', `${rows.length}개`)}
                    ${chip('매수 가능', `${eligibleCount}개`)}
                    ${chip('총 매수 예정', `${formatNumber(totalBuyAmt)}원`)}
                    ${chip('가용 현금', `${formatNumber(totalAvailable)}원`)}
                </span>
            </div>
            <table style="width:100%; font-size:11px;"><thead><tr>
                    <th style="text-align:left;">종목</th>
                    <th>수량</th>
                    <th>현재가</th>
                    <th>평가금액</th>
                    <th>비중</th>
                    <th>목표대비 부족</th>
                    <th>매수수량</th>
                    <th>매수금액</th>
                </tr></thead>
                <tbody>
                ${(() => {
                    const totalHeldValue = rows.reduce((sum, s) => sum + s.heldValue, 0);
                    return rows.map(s => {
                        const weight = totalHeldValue > 0 ? (s.heldValue / totalHeldValue * 100).toFixed(1) : '0.0';
                        return `<tr style="${s.buyQty > 0 ? '' : 'opacity:0.5;'}">
                    <td style="text-align:left;">${getNameHtml(s.name)}</td>
                    <td>${s.heldQty}주</td>
                    <td>${formatNumber(s.price)}원</td>
                    <td>${formatNumber(s.heldValue)}원</td>
                    <td>${weight}%</td>
                    <td>${formatNumber(Math.round(s.shortage))}원</td>
                    <td style="font-weight:600; color:${s.buyQty > 0 ? '#dc2626' : '#94a3b8'};">${s.buyQty > 0 ? `+${s.buyQty}주` : '-'}</td>
                    <td>${s.buyAmt > 0 ? formatNumber(s.buyAmt) + '원' : '-'}</td>
                </tr>`;
                    }).join('');
                })()}
                </tbody>
            </table>`;

        return rows.filter(s => s.buyQty > 0);
    }

    async function handleConfirmAddOrder() {
        const statusEl = document.getElementById('addorder-status');

        // 포트폴리오 설정 저장 — rows 계산 전에 실행 (시세 없어도 항상 저장)
        // 추가투자 메뉴와 동일한 로직: 즐겨찾기 수(N)만큼 추천 상위 종목만 선정
        if (portfolioNames.length > 0) {
            try {
                const addInvestInput = document.getElementById('additional-investment-input');
                const addInvest = addInvestInput ? (parseFloat((addInvestInput.value || '').replace(/,/g, '')) || 0) : 0;
                const totalAvailable = (holdingsAccountInfo ? (holdingsAccountInfo.ordAlowa || holdingsAccountInfo.cash) : 0) + addInvest;
                const N = portfolioNames.length;
                const recommendList = computeRecommendData();
                const rankByName = new Map(recommendList.map(r => [r.name, r.rank]));
                // 추천 순위 N위 이내 종목만 (시세 유무 무관)
                const eligible = portfolioNames
                    .filter(name => (rankByName.get(name) ?? Infinity) <= N)
                    .map(name => ({
                        code:   findStockCode(name) || '',
                        name:   name,
                        weight: 1,   // 균등 비중 — 서버가 합계로 나눠 계산
                    }));
                if (eligible.length > 0) {
                    await fetch('http://localhost:5050/api/portfolio/settings', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            stocks: eligible,
                            total_investment: totalAvailable,
                        }),
                    });
                    if (statusEl) statusEl.textContent = `포트폴리오 설정 저장 완료 (${eligible.length}종목)`;
                } else {
                    if (statusEl) statusEl.textContent = '추천 순위 내 종목이 없어 설정을 저장하지 않았습니다.';
                }
            } catch (e) { /* 서버 미실행 시 무시 */ }
        }

        const rows = computeAddOrderData();
        if (rows.length === 0) {
            if (statusEl) statusEl.textContent = '매수할 종목이 없습니다. (보유 내역 조회 후 다시 시도)';

        }
        if (statusEl) statusEl.textContent = '추가 투자 주문을 주문 실행 메뉴로 전달합니다...';

        // 추가 투자 주문을 pendingOrders 형태로 세팅 후 주문 실행 메뉴로 이동
        pendingAddOrders = rows.map(s => ({
            name: s.name,
            code: s.code,
            side: 'buy',
            qty: s.buyQty,
            price: s.price,
            isAddOrder: true,
        }));
        renderOrderTable();
        document.getElementById('invest-addorder-send').style.display = 'block';
        document.getElementById('addorder-status').textContent = `✅ ${rows.length}건 주문 준비 완료 — 아래 주문 전송 버튼을 눌러 실행하세요.`;
    }

    // 투자금/선택종목 입력 상태를 리밸런싱(입력)과 주문 실행(참고용) 메뉴에 동일하게 요약 표시
    // "📌 현재 계좌"(실제 보유 자산)와 "🎯 목표 계획"(투자금 입력에 따른 예상치)을 분리해서,
    // 같은 "현금"이라는 단어가 서로 다른 의미(실제 잔고 vs 매수 후 예상 잔액)로 섞이지 않게 한다.
    function renderPortfolioSummary() {

            const tdy = holdingsAccountInfo.todayStatusInfo;
            const ct  = holdingsAccountInfo.contractInfo;
            const si  = holdingsAccountInfo.settlementInfo;
            const ae  = holdingsAccountInfo.acntEvalInfo;
            const dep = holdingsAccountInfo.depositInfo;

            // 행 ① 자산현황
            const assetRow = groupRow('📌', '자산현황',
                chip('추정예탁자산', `${formatNumber(holdingsAccountInfo.totalAsset)}원`)
                + chip('평가금액', `${formatNumber(holdingsAccountInfo.totalEval)}원`)
                + chip('현금', `${formatNumber(holdingsAccountInfo.cash)}원`)
                + chip('평가손익', `${formatNumber(holdingsAccountInfo.totalPL)}원`)
                + chip('수익률', `<span style="color:${prftRtColor};font-weight:700;">${prftRtVal >= 0 ? '+' : ''}${prftRtVal.toFixed(2)}%</span>`));

            // 행 ② 손익
            let plChips = '';
            if (ae) {
                const tdyC = ae.tdyLspft >= 0 ? '#dc2626' : '#2563eb';
                const monC = ae.lspft2   >= 0 ? '#dc2626' : '#2563eb';
                const cumC = ae.lspft    >= 0 ? '#dc2626' : '#2563eb';
                plChips = chip('당일', `<span style="color:${tdyC};font-weight:700;">${ae.tdyLspft >= 0 ? '+' : ''}${formatNumber(ae.tdyLspft)}원 (${ae.tdyLspftRt >= 0 ? '+' : ''}${ae.tdyLspftRt.toFixed(2)}%)</span>`)
                    + chip('당월', `<span style="color:${monC};font-weight:700;">${ae.lspft2 >= 0 ? '+' : ''}${formatNumber(ae.lspft2)}원 (${ae.lspftRatio >= 0 ? '+' : ''}${ae.lspftRatio.toFixed(2)}%)</span>`)
                    + chip('누적', `<span style="color:${cumC};font-weight:700;">${ae.lspft >= 0 ? '+' : ''}${formatNumber(ae.lspft)}원 (${ae.lspftRt >= 0 ? '+' : ''}${ae.lspftRt.toFixed(2)}%)</span>`);
            }
            const plRow = (plChips && ae && (ae.tdyLspft || ae.lspft2 || ae.lspft)) ? groupRow('📈', '손익', plChips) : '';

            // 행 ③ 거래
            let tradeChips = '';
            if (tdy && (tdy.sellAmt || tdy.buyAmt)) {
                tradeChips += chip('매도', `${formatNumber(tdy.sellAmt)}원`)
                           + chip('매수', `${formatNumber(tdy.buyAmt)}원`)
                           + chip('수수료+세금', `${formatNumber(tdy.cmsn + tdy.tax)}원`);
            }
            if (ct && ct.total > 0) {
                tradeChips += chip('약정', `${formatNumber(ct.total)}원`);
            }
            if (si && (si.sellSum || si.buySum)) {
                tradeChips += chip('익일 매도정산', `${formatNumber(si.sellSum)}원`)
                           + chip('익일 매수정산', `${formatNumber(si.buySum)}원`);
            }
            if (tdy && tdy.dividaAmt > 0) {
                tradeChips += chip('💰 배당금', `<span style="color:#16a34a;font-weight:700;">${formatNumber(tdy.dividaAmt)}원</span>`);
            }
            const tradeRow = tradeChips ? groupRow('💳', '거래', tradeChips) : '';

            // 행 ④ 예수금
            let depChips2 = '';
            if (dep) {
                depChips2 = chip('예수금', `${formatNumber(dep.entr)}원`)
                    + chip('출금가능', `${formatNumber(dep.pymnAlow)}원`)
                    + chip('주문가능', `${formatNumber(dep.ordAlow)}원`)
                    + chip('D+1', `${formatNumber(dep.d1Entr)}원`)
                    + chip('D+2', `${formatNumber(dep.d2Entr)}원`);
            }
            const depRow = depChips2 ? groupRow('🏦', '예수금', depChips2) : '';

            html += `<div style="margin-bottom:6px;">${assetRow}${plRow}${tradeRow}${depRow}</div>`;
        }

        if (portfolioNames.length === 0) {
            html += '⭐ 선택한 종목을 가져와 주세요.';

            if (el) el.innerHTML = html;
        });
    }

    let updateDataPollTimer = null;

    async function handleUpdateData() {
        const statusEl = document.getElementById('update-data-status');
        const btn = document.getElementById('btn-update-data');
        try {
            const resp = await fetch(`${ORDER_SERVER_URL}/api/update_data`, { method: 'POST' });
            const data = await resp.json();
            if (data.error) {
                statusEl.textContent = data.error;
                return;
            }
            btn.disabled = true;
            statusEl.textContent = '갱신 중... (DART는 캐시 재사용이라 보통 몇 분 내 완료)';
            if (updateDataPollTimer) clearInterval(updateDataPollTimer);
            updateDataPollTimer = setInterval(pollUpdateDataStatus, 5000);
        } catch (e) {
            statusEl.textContent = `❌ 로컬 주문 서버에 연결할 수 없습니다. (python order_server.py 실행 필요)`;

    async function pollUpdateDataStatus() {
        const statusEl = document.getElementById('update-data-status');
        const btn = document.getElementById('btn-update-data');
        try {
            const resp = await fetch(`${ORDER_SERVER_URL}/api/update_status`);
            const data = await resp.json();

                updateDataPollTimer = null;

                statusEl.textContent = data.success
                    ? '✅ 갱신 완료 - 새로고침(F5) 해주세요. (이 PC에 저장만 됨, 깃허브 미배포)'
                    : '❌ 갱신 실패 - PC에서 로그 확인 필요';

                statusEl.textContent = '갱신 중...';
            }

    const ORDER_SERVER_URL = 'http://127.0.0.1:5050';

    // 로컬 주문 서버 인증 토큰 - 브라우저에만 저장(localStorage), git에는 절대 포함되지 않음.
    // 최초 1회만 입력하면 이후엔 자동으로 매 요청에 실림.
    function getApiAuthToken() {
        let t = localStorage.getItem('quant_api_token');
        if (!t) {
            t = prompt('주문 서버 인증 토큰을 입력하세요 (최초 1회만):');
            if (t) localStorage.setItem('quant_api_token', t.trim());
        }
        return t ? t.trim() : '';
    }

    (function installAuthTokenFetchWrapper() {
        const _origFetch = window.fetch;
        window.fetch = function (input, init) {
            const url = typeof input === 'string' ? input : (input && input.url) || '';
            if (url.includes('127.0.0.1:5050') || url.includes('localhost:5050')) {
                init = init || {};
                init.headers = Object.assign({}, init.headers, { 'X-API-Token': getApiAuthToken() });
            }
            return _origFetch(input, init);
        };
    })();
    const ORDER_POLL_INTERVAL_MS = 30000;
    const WEIGHT_DEVIATION_ALERT_PCT = 10;  // 목표 대비 비중 차이가 이 %를 넘으면 알림
    let holdingsByCode = {};   // stk_cd -> {name, qty, price}
    let holdingsLoaded = false;
    let holdingsAccountInfo = null;  // {totalAsset, totalEval, cash, totalPurchase, totalPL}
    let freshPriceByCode = {};   // 미보유 목표종목 실시간 시세
    let priceLimitsByCode = {};  // 종목별 상한가·하한가·예상체결가 (ka10001)
    let fluRtByCode = {};        // 종목별 등락율 (ka10001 flu_rt)
    let yearHighRatioByCode = {};  // 종목별 52주(250일) 최고가 대비율 (ka10001 250hgst_pric_pre_rt)
    let orderPollTimer = null;
    let openOrdersPollTimer = null;
    let realtimeStatusTimer = null;
    let lastRealtimeSeq = null;  // 웹소켓 이벤트 카운터 — 값이 바뀌면 REST 재조회 트리거
    let lastAutoHoldingsRefresh = 0;  // handleFetchHoldings 자동 트리거 최소 간격(throttle)용
    let realtimeQuotesByCode = {};  // 0B 체결강도 등 REST엔 없는 실시간 전용 지표 캐시
    let hasOpenOrders = false;  // 미체결 주문 존재 여부 (renderOpenOrdersSection에서 갱신)
    let lastFilledCount = null;

    async function handleEnableNotifications() {
        const btn = document.getElementById('btn-enable-notif');
        if (!('Notification' in window)) {
            alert('이 브라우저는 알림 기능을 지원하지 않습니다.');
            return;
        }
        const result = await Notification.requestPermission();
        if (btn) btn.textContent = result === 'granted' ? '🔔 알림 켜짐' : '🔕 알림 꺼짐 (차단됨)';
    }

    function notify(title, body) {
        if ('Notification' in window && Notification.permission === 'granted') {
            new Notification(title, { body });
        }
    }

    function startOrderPolling() {
        stopOrderPolling();
        // 안전망 — 웹소켓이 끊겨도 최악의 경우 60초 안에는 갱신되도록 유지 (포트폴리오 탭도 동일하게 보호)
        orderPollTimer = setInterval(() => {
            if ((currentMenu !== 'invest' && currentMenu !== 'portfolio') || !holdingsLoaded) return;
            handleFetchHoldings(true);
            checkOrderFillStatus();
        }, ORDER_POLL_INTERVAL_MS);
        // 안전망 — realtimeStatusTimer의 seq 변화 감지로 대부분 즉시 갱신되므로, 이건 웹소켓 유실 대비용
        openOrdersPollTimer = setInterval(() => {
            if (currentMenu !== 'order') return;
            renderOpenOrdersSection();
        }, 120000);
        // 웹소켓 이벤트 카운터를 가볍게(3초) 폴링 — 키움 REST 호출 없이 로컬 서버 메모리만 읽으므로 저비용.
        // 값이 바뀐 순간에만 실제 REST 재조회를 트리거해 지연을 최소화한다.
        realtimeStatusTimer = setInterval(async () => {
            try {
                const resp = await fetch(`${ORDER_SERVER_URL}/api/realtime_status`);
                const data = await resp.json();
                if (lastRealtimeSeq !== null && data.seq !== lastRealtimeSeq) {
                    const now = Date.now();
                    // handleFetchHoldings 한 번에 kt00018/kt00005/kt00001/kt00009/kt00017/kt00008/kt00004
                    // 7개 REST가 딸려 나가므로, 체결이 연달아 터져도 최소 8초 간격으로만 재조회한다.
                    if (currentMenu === 'invest' && holdingsLoaded && now - lastAutoHoldingsRefresh > 8000) {
                        lastAutoHoldingsRefresh = now;
                        handleFetchHoldings(true);
                        checkOrderFillStatus();
                    }
                    if (currentMenu === 'order') {
                        renderOpenOrdersSection();
                    }
                }
                lastRealtimeSeq = data.seq;
            } catch (e) {
                // 로컬 서버 미실행 등 - 조용히 무시
            }
            // 보유 종목 실시간 체결가(0B) 반영 — REST /api/quotes 호출 없이 로컬 캐시만 읽음
            if (holdingsLoaded && (currentMenu === 'invest' || currentMenu === 'portfolio')) {
                applyRealtimeQuotes();
            }
        }, 3000);
    }

    // 상한가까지 남은 거리(%p) — 한국 증시는 전일종가 대비 ±30%가 상하한가로 고정되어 있어,
    // 등락률(flu_rt)만 있으면 추가 API 호출 없이 근사 계산 가능.
    function upperLimitDistanceLabel(code) {
        const flu = (holdingsByCode[code] && holdingsByCode[code].fluRt != null) ? holdingsByCode[code].fluRt
            : (fluRtByCode[code] != null ? fluRtByCode[code] : null);
        if (flu == null) return '<span style="color:#cbd5e1;">-</span>';
        const dist = 30 - flu;
        const color = dist <= 3 ? '#dc2626' : (dist <= 10 ? '#d97706' : '#64748b');
        return `<span style="color:${color};">${dist.toFixed(1)}%p</span>`;
    }

    // 52주(250일) 최고가 대비율 - ka10001 250hgst_pric_pre_rt, 장기 보유 관점에서 고점 대비 위치 파악용.
    function yearHighRatioLabel(code) {
        const rt = code ? yearHighRatioByCode[code] : null;
        if (rt == null) return '<span style="color:#cbd5e1;">-</span>';
        const color = rt <= -30 ? '#2563eb' : (rt <= -15 ? '#d97706' : '#64748b');
        return `<span style="color:${color};">${rt > 0 ? '+' : ''}${rt.toFixed(1)}%</span>`;
    }

    // 0B 체결강도(228) — REST 현재가 조회엔 없는 값. 100% 기준 매수/매도 체결 세기 비교.
    function strengthLabel(code) {
        const q = code ? realtimeQuotesByCode[code] : null;
        if (!q || q.strength == null || q.strength === '') return '<span style="color:#cbd5e1;">-</span>';
        const val = parseFloat(q.strength);
        if (isNaN(val)) return '<span style="color:#cbd5e1;">-</span>';
        const color = val >= 120 ? '#dc2626' : val <= 80 ? '#2563eb' : '#64748b';
        return `<span style="color:${color};">${val.toFixed(1)}%</span>`;
    }

    // 실시간 체결가로 보유종목 시세가 바뀌면 평가금액/평가손익/수익률/총자산을 다시 계산해 요약 칩에 반영.
    // REST 재조회(kt00018 등) 없이, 이미 갖고 있는 현금(cash)·매입금액(totalPurchase)에 최신 시세만 곱해 근사한다.
    function recomputeAccountInfoFromLivePrices() {
        if (!holdingsAccountInfo) return;
        const totalEval = Object.values(holdingsByCode)
            .reduce((sum, h) => sum + (h.qty > 0 ? h.qty * h.price : 0), 0);
        holdingsAccountInfo.totalEval = totalEval;
        holdingsAccountInfo.totalAsset = holdingsAccountInfo.cash + totalEval;
        holdingsAccountInfo.totalPL = totalEval - holdingsAccountInfo.totalPurchase;
        holdingsAccountInfo.totalPrftRt = holdingsAccountInfo.totalPurchase > 0
            ? (holdingsAccountInfo.totalPL / holdingsAccountInfo.totalPurchase * 100) : 0;
    }

    // 0B(실시간체결가) 캐시를 holdingsByCode에 병합 — 키움 REST 호출 없이 화면 시세만 갱신
    async function applyRealtimeQuotes() {
        try {
            const resp = await fetch(`${ORDER_SERVER_URL}/api/realtime_quotes`);
            const quotes = await resp.json();
            realtimeQuotesByCode = quotes;  // 체결강도(228) 등 REST에 없는 값은 렌더링 시 직접 조회
            let changed = false;
            Object.entries(quotes).forEach(([code, q]) => {
                const held = holdingsByCode[code];
                if (!held || !q.price) return;
                const price = Math.abs(parseInt(q.price, 10) || 0);
                if (price && price !== held.price) {
                    held.price = price;
                    if (q.rate != null) held.fluRt = parseFloat(q.rate) || held.fluRt;
                    // REST 스냅샷 시점의 prft_rt는 그대로 두면 실시간 시세를 못 따라가서 고정돼
                    // 보이므로, 평단가 기준으로 매 틱마다 직접 재계산한다.
                    if (held.purPrice > 0) held.prftRt = (price - held.purPrice) / held.purPrice * 100;
                    changed = true;
                }
            });
            if (changed) {
                recomputeAccountInfoFromLivePrices();
                if (currentMenu === 'invest') { renderInvestCalc(); renderInvestSummary(); }
                else if (currentMenu === 'portfolio') { renderRebalanceTable(); renderPortfolioSummary(); }
            }
        } catch (e) {
            // 로컬 서버 미실행 등 - 조용히 무시
        }
    }

    let recommendPricePollTimer = null;

    // 추천 메뉴는 수천 종목을 다뤄서 전체 실시간 구독은 무리지만, 화면에 실제로 보이는
    // 종목(대개 top50 안팎)만큼은 REST 배치 조회로 장중 현재가를 따라가게 한다.
    function startRecommendPricePolling() {
        stopRecommendPricePolling();
        recommendPricePollTimer = setInterval(async () => {
            if (currentMenu !== 'recommend' || recommendDataCache.length === 0) return;
            const codes = recommendDataCache.map(s => s.code || findStockCode(s.name)).filter(Boolean);
            if (codes.length === 0) return;
            try {
                const prices = await fetchFreshQuotes(codes);
                let changed = false;
                recommendDataCache.forEach(s => {
                    const code = s.code || findStockCode(s.name);
                    const p = code ? prices[code] : null;
                    if (p && p !== s.price) { s.price = p; changed = true; }
                });
                if (changed && currentMenu === 'recommend') renderRecommendTable(filterBySearch(recommendDataCache));
            } catch (e) {
                // 로컬 서버 미실행 등 - 조용히 무시
            }
        }, 15000);
    }

    function stopRecommendPricePolling() {
        if (recommendPricePollTimer) {
            clearInterval(recommendPricePollTimer);
            recommendPricePollTimer = null;
        }
    }

    function stopOrderPolling() {
        if (orderPollTimer) {
            clearInterval(orderPollTimer);
            orderPollTimer = null;
        }
        if (openOrdersPollTimer) {
            clearInterval(openOrdersPollTimer);
            openOrdersPollTimer = null;
        }
        if (realtimeStatusTimer) {
            clearInterval(realtimeStatusTimer);
            realtimeStatusTimer = null;
        }
        lastRealtimeSeq = null;
        lastAutoHoldingsRefresh = 0;
    }

    async function checkOrderFillStatus() {
        try {
            const resp = await fetch(`${ORDER_SERVER_URL}/api/order_status`);
            const data = await resp.json();
            if (data.error) return;
            const rows = data.acnt_ord_cntr_prst_array || [];
            const filledCount = rows.filter(r => r.cntr_qty && parseInt(r.cntr_qty, 10) > 0).length;
            if (lastFilledCount !== null && filledCount > lastFilledCount) {
                notify('주문 체결', `새로운 체결이 감지되었습니다 (체결 ${filledCount}건)`);
            }
            lastFilledCount = filledCount;
        } catch (e) {
            // 로컬 서버 미실행 등 - 조용히 무시
        }
    }

    // 보유내역 조회는 주문실행/리밸런싱 메뉴 양쪽에서 트리거할 수 있으므로, 상태 문구는 두 메뉴의
    // status 영역에 동시에 표시한다 (한쪽에서 조회하면 다른 쪽에서도 별도로 다시 누를 필요 없음).
    function holdingsRequiredPlaceholderHtml() {
        return `<tbody><tr><td style="padding:30px; color:#94a3b8;">보유 내역 조회 중...</td></tr></tbody>`;

    function setHoldingsStatusText(text) {
        ['invest-status', 'rebalance-status'].forEach(id => {

            if (el) el.textContent = text;
        });

    async function handleFetchHoldings(silent) {
        if (!silent) setHoldingsStatusText('조회 중...');
        try {
            // kt00018로 전체 보유 목록 조회 (stk_cntr_remn은 결제완료 종목만 반환해 누락 발생)
            const resp = await fetch(`${ORDER_SERVER_URL}/api/holdings`);
            const data = await resp.json();
            if (data.error || (data.return_code !== undefined && data.return_code !== 0)) {
                throw new Error(data.error || data.return_msg || '조회 실패');
            }
            holdingsByCode = {};
            (data.acnt_evlt_remn_indv_tot || []).forEach(r => {
                const code = (r.stk_cd || '').replace(/^A/, '');
                if (!code) return;
                const curP  = parseInt(r.cur_prc || r.cur_pric || '0', 10) || 0;
                const predP = parseInt(r.pred_close_pric || '0', 10) || 0;
                holdingsByCode[code] = {
                    name: r.stk_nm || '',
                    qty: parseInt(r.rmnd_qty || '0', 10) || 0,
                    // 매매가능수량 (결제 완료분). 필드가 아예 없는 것(null)과 실제로 0인 것을 구분해야
                    // "매매가능수량 0(결제 전이라 매도 불가)"을 "필드 누락"으로 오인해 전량 매도로
                    // 폴백하는 사고를 막을 수 있다.
                    trdeAbleQty: (r.trde_able_qty != null) ? (parseInt(r.trde_able_qty, 10) || 0) : null,
                    price: curP,
                    purPrice: parseInt(r.pur_pric || '0', 10) || 0,
                    purAmt:   parseInt(r.pur_amt  || '0', 10) || 0,
                    prftRt: parseFloat(r.prft_rt || '0') || 0,
                    evltvPrft: parseInt(r.evltv_prft || '0', 10) || 0,
                    possRt: parseFloat(r.poss_rt || '0') || 0,
                    fluRt: predP > 0 ? ((curP - predP) / predP * 100) : 0,
                    sumCmsn:  parseInt(r.sum_cmsn || '0', 10) || 0,
                    tax:      parseInt(r.tax      || '0', 10) || 0,
                    tdyBuyq:  parseInt(r.tdy_buyq  || '0', 10) || 0,
                    tdySellq: parseInt(r.tdy_sellq || '0', 10) || 0,
                    predBuyq: parseInt(r.pred_buyq  || '0', 10) || 0,
                    predSellq:parseInt(r.pred_sellq || '0', 10) || 0,
                };
            });

            // 52주 고점대비(ka10001 250hgst_pric_pre_rt) - 실시간 시세 로테이션엔 없는 필드라 별도 조회
            try {
                const heldCodes = Object.keys(holdingsByCode);
                if (heldCodes.length > 0) {
                    const respYh = await fetch(`${ORDER_SERVER_URL}/api/year_high_ratio?codes=${heldCodes.join(',')}`);
                    const dataYh = await respYh.json();
                    if (!dataYh.error) yearHighRatioByCode = dataYh;
                }
            } catch (e) { /* 실패해도 '-'로 표시될 뿐 나머지 조회는 계속 진행 */ }

            const totalAsset = parseInt(data.prsm_dpst_aset_amt || '0', 10) || 0;
            const totalEval = parseInt(data.tot_evlt_amt || '0', 10) || 0;
            let ordAlowa = totalAsset - totalEval;  // kt00018 기본 현금 추정

            // kt00005로 정확한 주문가능현금(ord_alowa) 보완
            try {
                const resp5 = await fetch(`${ORDER_SERVER_URL}/api/settlement_balance`);
                const data5 = await resp5.json();
                if (!data5.error && data5.return_code === 0 && data5.ord_alowa) {
                    ordAlowa = parseInt(data5.ord_alowa, 10) || ordAlowa;
                }
            } catch (e) { /* kt00005 실패 시 kt00018 추정값 사용 */ }

            // kt00001 예수금 상세 (예수금/출금가능/주문가능/D+1~D+2)
            let depositInfo = null;
            try {
                const respDep = await fetch(`${ORDER_SERVER_URL}/api/deposit`);
                const dataDep = await respDep.json();
                if (!dataDep.error) {
                    depositInfo = {
                        entr:       parseInt(dataDep.entr || '0', 10) || 0,
                        pymnAlow:   parseInt(dataDep.pymn_alow_amt || '0', 10) || 0,
                        ordAlow:    parseInt(dataDep.ord_alow_amt || '0', 10) || 0,
                        d1Entr:     parseInt(dataDep.d1_entra || '0', 10) || 0,
                        d1PymnAlow: parseInt(dataDep.d1_pymn_alow_amt || '0', 10) || 0,
                        d2Entr:     parseInt(dataDep.d2_entra || '0', 10) || 0,
                        profaCh:    parseInt(dataDep.profa_ch || '0', 10) || 0,  // 보유종목 위탁증거금(현금)
                    };
                    if (depositInfo.ordAlow > 0) ordAlowa = depositInfo.ordAlow;
                }
            } catch (e) { /* kt00001 실패 무시 */ }

            // kt00009 당일 약정금액
            let contractInfo = null;
            try {
                const respCt = await fetch(`${ORDER_SERVER_URL}/api/daily_contract`);
                const dataCt = await respCt.json();
                if (!dataCt.error && dataCt.total > 0) contractInfo = dataCt;
            } catch (e) { /* kt00009 실패 무시 */ }

            // kt00017 당일현황 추가 필드 (매도/매수금액, 수수료/세금, 배당금)
            let todayStatusInfo = null;
            try {
                const respTdy = await fetch(`${ORDER_SERVER_URL}/api/today_deposit`);
                const dataTdy = await respTdy.json();
                if (!dataTdy.error) {
                    todayStatusInfo = {
                        sellAmt:  parseInt(dataTdy.sell_amt  || '0', 10) || 0,
                        buyAmt:   parseInt(dataTdy.buy_amt   || '0', 10) || 0,
                        cmsn:     parseInt(dataTdy.cmsn      || '0', 10) || 0,
                        tax:      parseInt(dataTdy.tax       || '0', 10) || 0,
                        dividaAmt:parseInt(dataTdy.dvida_amt || '0', 10) || 0,
                    };
                }
            } catch (e) { /* kt00017 실패 무시 */ }

            // kt00008 익일 결제 예정 내역
            let settlementInfo = null;
            try {
                const respSetl = await fetch(`${ORDER_SERVER_URL}/api/next_day_settlement`);
                const dataSetl = await respSetl.json();
                if (!dataSetl.error) {
                    const rows = dataSetl.acnt_nxdy_setl_frcs_prps_array || [];
                    const totCmsn = rows.reduce((s, r) =>
                        s + (parseInt(r.cmsn||'0',10)||0)
                          + (parseInt(r.trde_tax||'0',10)||0)
                          + (parseInt(r.incm_tax||'0',10)||0)
                          + (parseInt(r.rstx||'0',10)||0)
                          + (parseInt(r.resi_tax||'0',10)||0), 0);
                    settlementInfo = {
                        sellSum: parseInt(dataSetl.sell_amt_sum||'0',10)||0,
                        buySum:  parseInt(dataSetl.buy_amt_sum||'0',10)||0,
                        totCmsn,
                        rows: rows.map(r => ({
                            name:    r.stk_nm || '',
                            tp:      (r.sell_tp||'').startsWith('1') ? '매도' : '매수',
                            exctAmt: parseInt(r.exct_amt||'0',10)||0,
                        })),
                    };
                }
            } catch (e) { /* kt00008 실패 무시 */ }

            // kt00004 계좌평가현황 (당일/당월/누적 손익 + 종목별 금일 매수/매도 수량)
            let acntEvalInfo = null;
            let acntEvalByCode = {};
            try {
                const respAcnt = await fetch(`${ORDER_SERVER_URL}/api/account_eval`);
                const dataAcnt = await respAcnt.json();
                if (!dataAcnt.error) {
                    acntEvalInfo = {
                        tdyLspft:    parseInt(dataAcnt.tdy_lspft || '0', 10) || 0,
                        tdyLspftRt:  parseFloat(dataAcnt.tdy_lspft_rt || '0') || 0,
                        lspft2:      parseInt(dataAcnt.lspft2 || '0', 10) || 0,
                        lspftRatio:  parseFloat(dataAcnt.lspft_ratio || '0') || 0,
                        lspft:       parseInt(dataAcnt.lspft || '0', 10) || 0,
                        lspftRt:     parseFloat(dataAcnt.lspft_rt || '0') || 0,
                    };
                    for (const s of (dataAcnt.stk_acnt_evlt_prst || [])) {
                        const cd = (s.stk_cd || '').replace(/^[AJQ]/, '');
                        acntEvalByCode[cd] = {
                            tdyBuyq:  parseInt(s.tdy_buyq || '0', 10) || 0,
                            tdySellq: parseInt(s.tdy_sellq || '0', 10) || 0,
                            predBuyq: parseInt(s.pred_buyq || '0', 10) || 0,
                            predSellq:parseInt(s.pred_sellq || '0', 10) || 0,
                        };
                    }
                }
            } catch (e) { /* kt00004 실패 무시 */ }

            holdingsAccountInfo = {
                totalAsset,               // prsm_dpst_aset_amt: 브로커 기준 추정예탁자산
                totalEval,
                cash: totalAsset - totalEval,  // 계좌 현금 = 총자산 - 평가금액
                ordAlowa,                 // 실제 주문가능현금(미체결 매수 차감 후) - 주문 한도 확인용
                totalPurchase: parseInt(data.tot_pur_amt || '0', 10) || 0,
                totalPL: parseInt(data.tot_evlt_pl || '0', 10) || 0,
                totalPrftRt: parseFloat(data.tot_prft_rt || '0') || 0,
                depositInfo,              // kt00001 예수금 상세
                contractInfo,             // kt00009 당일 약정금액
                todayStatusInfo,          // kt00017 당일 매도/매수/수수료/세금/배당
                settlementInfo,           // kt00008 익일 결제 예정
                acntEvalInfo,             // kt00004 당일/당월/누적 손익
                acntEvalByCode,           // kt00004 종목별 금일 매수/매도 수량
            };
            // silent=true(주문 실행 중 내부 호출)일 때는 투자금 기준을 고정 - 주문 중 재계산으로 목표수량이 변하는 것을 방지
            if (!silent) {
                portfolioBaseAmount = holdingsAccountInfo.totalAsset;
                recomputePortfolioInvestment();
            }
            holdingsLoaded = true;

            // 목표 종목 중 아직 보유하지 않은 종목도 실시간 시세를 같이 받아온다 (데이터 며칠 전 주가 대신)
            const unheldCodes = portfolioNames
                .map(name => findStockCode(name))
                .filter(code => code && !holdingsByCode[code]);
            if (unheldCodes.length > 0) {
                try {
                    const freshPrices = await fetchFreshQuotes(unheldCodes);
                    Object.assign(freshPriceByCode, freshPrices);
                } catch (e) {
                    // 미보유 종목 시세 조회 실패는 치명적이지 않으므로 무시하고 기존 주가로 계산
                }
            }

            setHoldingsStatusText(`조회 완료 (${Object.keys(holdingsByCode).length}종목 보유, ${new Date().toLocaleTimeString()} 기준)`);
            if (currentMenu === 'invest') startOrderPolling();
        } catch (e) {
            holdingsLoaded = false;
            setHoldingsStatusText(`❌ 로컬 주문 서버에 연결할 수 없습니다. (python order_server.py 실행 필요) - ${e.message}`);
            stopOrderPolling();
        }
        refreshCurrentTable();
    }

    // 목표 비중(포트폴리오 메뉴에서 계산한 균등비중 목표수량) vs 현재 보유수량을 비교해 매수/매도 수량을 산출
    function computeOrderData(names) {
        const targets = computePortfolioData(names);  // [{name, price, shares, rank}, ...]
        const rows = [];
        const seenCodes = new Set();

        targets.forEach(t => {
            const code = t.code || findStockCode(t.name);
            if (!code && !t.priceUnknown) return; // code 없고 가격도 없으면 skip
            if (code) seenCodes.add(code);
            if (t.priceUnknown) {
                // 시세 미확인 신규 종목 — 주문 테이블에 표시만, 실제 주문 불가
                rows.push({ name: t.name, code: code || '', price: 0, targetQty: 0, curQty: 0, diff: 0, weightDiffPct: 0, side: '', isNew: true, priceUnknown: true });
                return;
            }
            const held = holdingsByCode[code];
            const curQty = held ? held.qty : 0;
            // 매도 시 실제 가능 수량은 trdeAbleQty (D+2 미결제분 제외).
            // 필드가 없을 때만 보유수량으로 폴백 — 진짜 0(결제 전)이면 0 그대로 써서 매도 차단.
            const sellableQty = held ? (held.trdeAbleQty != null ? held.trdeAbleQty : held.qty) : 0;
            const rawDiff = t.shares - curQty;
            const diff = rawDiff < 0 ? Math.max(rawDiff, -sellableQty) : rawDiff;
            const targetValue = t.shares * t.price;
            const curValue = curQty * t.price;
            // 매수/매도 수량(diff)과 부호를 통일: 음수 = 매도 필요, 양수 = 매수 필요
            const weightDiffPct = targetValue > 0 ? ((targetValue - curValue) / targetValue) * 100 : (curValue > 0 ? -100 : 0);
            rows.push({
                name: t.name, code, price: t.price, rank: t.rank,
                targetQty: t.shares, curQty, diff, weightDiffPct, isNew: curQty === 0 && !held,
                side: diff > 0 ? 'buy' : (diff < 0 ? 'sell' : ''),
            });
        });

        // 목표에는 없지만 현재 보유 중인 종목 (전량 매도 후보)
        Object.keys(holdingsByCode).forEach(code => {
            if (seenCodes.has(code)) return;
            const held = holdingsByCode[code];
            if (held.qty <= 0) return;
            const sellableQty = held.trdeAbleQty != null ? held.trdeAbleQty : held.qty;
            if (sellableQty <= 0) return;
            rows.push({
                name: held.name, code, price: held.price,
                targetQty: 0, curQty: held.qty, diff: -sellableQty, weightDiffPct: -100, side: 'sell',
            });
        });

        checkWeightDeviations(rows);
        return rows;
    }

    function checkWeightDeviations(rows) {
        rows.forEach(r => {
            const exceeded = Math.abs(r.weightDiffPct) >= WEIGHT_DEVIATION_ALERT_PCT;
            if (exceeded && !notifiedDeviationCodes.has(r.code)) {
                notifiedDeviationCodes.add(r.code);
                notify('목표 비중 이탈', `${r.name}: 목표 대비 ${r.weightDiffPct > 0 ? '+' : ''}${r.weightDiffPct.toFixed(1)}% 차이`);
            } else if (!exceeded && notifiedDeviationCodes.has(r.code)) {
                notifiedDeviationCodes.delete(r.code);
            }
        });
    }

    async function fetchFreshQuotes(codes) {
        const resp = await fetch(`${ORDER_SERVER_URL}/api/quotes?codes=${codes.join(',')}`);
        const data = await resp.json();
        if (data.error) throw new Error(data.error);
        // 응답에서 가격만 추출해 {code: price} 형태로 반환하고, 상·하한가는 전역 캐시에 저장
        const prices = {};
        Object.entries(data.prices || {}).forEach(([code, val]) => {
            if (val && typeof val === 'object') {
                prices[code] = val.price;
                priceLimitsByCode[code] = {
                    upper: val.upper_limit,
                    lower: val.lower_limit,
                    exp: val.exp_price,
                };
                if (val.flu_rt != null) fluRtByCode[code] = val.flu_rt;
            } else {
                prices[code] = val;  // 구형 응답 폴백
            }
        });
        return prices;  // {code: price}
    }

    // ka10076(체결요청)으로 미체결 주문을 조회한다.
    // oso_qty(미체결수량) 필드가 직접 제공되어 kt00009보다 정확하고 단순하다.
    // ord_stt(주문상태)로 실제 살아있는 주문만 필터링 가능.
    // kt00007(계좌별주문체결내역상세, qry_tp=3 미체결만) 로 미체결 주문을 조회한다.
    // API가 미체결만 반환하므로 별도 필터링 불필요, ord_remnq(주문잔량) 직접 사용.
    async function fetchOpenOrders() {
        const resp = await fetch(`${ORDER_SERVER_URL}/api/open_orders`);
        const data = await resp.json();
        if (data.error) throw new Error(data.error);
        const rows = data.acnt_ord_cntr_prps_dtl || [];
        return rows
            .map(r => ({
                code: (r.stk_cd || '').replace(/\D/g, ''),
                name: r.stk_nm || '',
                ordNo: r.ord_no,
                side: (r.io_tp_nm || '').includes('매도') ? 'sell' : ((r.io_tp_nm || '').includes('매수') ? 'buy' : null),
                ordQty: parseInt(r.ord_qty, 10) || 0,
                cntrQty: parseInt(r.cntr_qty, 10) || 0,
                ordPrice: parseInt(r.ord_uv, 10) || 0,
                remainQty: parseInt(r.ord_remnq, 10) || 0,
            }))
            .filter(r => r.code && r.ordNo && r.remainQty > 0);
    }

    // 특정 종목코드들의 매도 미체결이 모두 소진될 때까지 대기 (최대 5분, 10초 간격)
    async function waitForSellsFilled(sellCodes, statusEl) {
        const maxTries = 30;  // 10초 × 30 = 5분
        for (let i = 0; i < maxTries; i++) {
            await new Promise(r => setTimeout(r, 10000));
            try {
                const open = await fetchOpenOrders();
                const pendingSells = open.filter(o => o.side === 'sell' && sellCodes.includes(o.code));
                if (pendingSells.length === 0) return true;
                const remaining = pendingSells.map(o => `${o.name||o.code}(${o.remainQty}주)`).join(', ');
                if (statusEl) statusEl.textContent = `매도 체결 대기 중... (${i+1}/${maxTries}) 미체결: ${remaining}`;
            } catch (e) {
                // 조회 실패 시 계속 대기
            }
        }
        return false;  // 타임아웃
    }

    // 주문 실행 화면 하단에 현재 미체결 주문 현황을 표로 보여준다.
    async function renderOpenOrdersSection() {
        const section = document.getElementById('open-orders-section');
        const table = document.getElementById('open-orders-table');
        if (!section || !table) return;

        // 15:30 이후: 동시호가 미체결은 자동 취소됨 — 섹션만 숨김
        const now = new Date();
        const hhmm = now.getHours() * 100 + now.getMinutes();
        if (hhmm >= 1530) {
            section.style.display = 'none';
            hasOpenOrders = false;
            return;
        }

        let openOrders;
        try {
            openOrders = await fetchOpenOrders();
        } catch (e) {
            section.style.display = 'none';
            return;
        }
        hasOpenOrders = openOrders.length > 0;
        // 미체결 현황이 바뀌면 포트폴리오 요약도 갱신 (1위 추가매수 활성/비활성 반영)
        if (currentMenu === 'rebalance') renderPortfolioSummary();
        if (openOrders.length === 0) {
            section.style.display = 'none';
            return;
        }
        section.style.display = 'block';
        let html = `<thead><tr>
            <th style="text-align:left;">종목명</th><th>매수/매도</th><th>주문수량</th><th>체결수량</th><th>미체결수량</th><th>주문가</th>
        </tr></thead><tbody>`;
        openOrders.forEach(o => {
            const sideLabel = o.side === 'buy' ? '<span style="color:#dc2626;">매수</span>' : (o.side === 'sell' ? '<span style="color:#2563eb;">매도</span>' : '-');
            html += `<tr>
                <td style="text-align:left;">${getNameHtml(o.name)}</td>
                <td>${sideLabel}</td>
                <td>${formatNumber(o.ordQty)}주</td>
                <td>${formatNumber(o.cntrQty)}주</td>
                <td>${formatNumber(o.remainQty)}주</td>
                <td>${formatNumber(o.ordPrice)}원</td>
            </tr>`;
        });
        html += `</tbody>`;
        table.innerHTML = html;
    }

    // 보낼 주문(rows)별로 같은 종목의 미체결 주문이 있으면: 같은 방향이면 정정주문(수량/가격만 갱신)으로 처리하고,
    // 방향이 다르면 취소한다. 정정으로 완전히 처리된 행은 결과 배열에서 제외해서 새 주문을 또 보내지 않게 한다.
    async function reconcileOpenOrdersAndFilter(rows) {
        const codeSet = new Set(rows.map(r => r.code));
        const openOrders = (await fetchOpenOrders()).filter(o => codeSet.has(o.code));
        const remaining = [];
        for (const r of rows) {
            const matchingOpenOrders = openOrders.filter(o => o.code === r.code);
            if (matchingOpenOrders.length === 0) {
                remaining.push(r);
                continue;
            }
            // 같은 방향 주문이 2건 이상이면 첫 번째만 정정하고 나머지는 중복이므로 취소
            const sameSide = matchingOpenOrders.filter(o => o.side === r.side);
            const oppSide = matchingOpenOrders.filter(o => o.side !== r.side);
            let needsNewOrder = false;

            // 반대 방향 주문 전부 취소
            for (const o of oppSide) {
                try {
                    const resp = await fetch(`${ORDER_SERVER_URL}/api/cancel_order`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ stk_cd: r.code, orig_ord_no: o.ordNo, cncl_qty: o.remainQty }),
                    });
                    const data = await resp.json();
                    const ok = !(data.error || (data.return_code !== undefined && data.return_code !== 0));
                    needsNewOrder = true;
                    if (!ok) { notifyOrderAction(r.name, `방향 변경으로 인한 기존 주문 취소 실패 - ${data.error || data.return_msg}`); }
                } catch (e) {
                    needsNewOrder = true;
                    notifyOrderAction(r.name, `미체결 주문 처리 실패 - ${e.message}`);
                }
                await new Promise(resolve => setTimeout(resolve, 1100));
            }

            // 같은 방향: 첫 번째만 정정, 나머지 중복 주문은 취소
            for (let i = 0; i < sameSide.length; i++) {
                const o = sameSide[i];
                try {
                    if (i === 0) {
                        // 첫 번째 → 정정. 매수는 목표 그대로 정정하면 자금 부족으로 매번 실패할 수
                        // 있으므로, 정정 전에 매수가능수량을 확인해 처음부터 맞는 수량으로 정정한다.
                        let mdfyQty = Math.abs(r.diff);
                        let mdfyPrice = r.price;
                        if (r.diff > 0) {
                            const { price: freshPrice, maxQty } = await fetchFreshAffordableQty(r.code);
                            if (freshPrice) mdfyPrice = freshPrice;
                            if (maxQty <= 0) {
                                notifyOrderAction(r.name, `정정 보류 - 매수 가능 수량 없음 (현재가 ${formatNumber(mdfyPrice)}원 기준)`);
                                await new Promise(resolve => setTimeout(resolve, 1100));
                                continue;
                            }
                            mdfyQty = Math.min(maxQty, mdfyQty);
                        }
                        const resp = await fetch(`${ORDER_SERVER_URL}/api/modify_order`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ stk_cd: r.code, orig_ord_no: o.ordNo, mdfy_qty: mdfyQty, mdfy_uv: mdfyPrice }),
                        });
                        const data = await resp.json();
                        const ok = !(data.error || (data.return_code !== undefined && data.return_code !== 0));
                        if (!ok) {
                            const errMsg = data.error || data.return_msg || '';
                            // 확인 직후에도 또 가격이 움직여 거부된 경우에 대한 마지막 안전망
                            if (r.diff > 0 && /부족/.test(errMsg)) {
                                try {
                                    await fetch(`${ORDER_SERVER_URL}/api/cancel_order`, {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ stk_cd: r.code, orig_ord_no: o.ordNo, cncl_qty: o.remainQty }),
                                    });
                                } catch (e) { /* 취소 실패해도 아래에서 새 주문 시도는 그대로 진행 */ }
                                const retried = await retryBuyWithAffordableQty(
                                    { name: r.name, code: r.code, price: mdfyPrice, diff: mdfyQty }, errMsg
                                );
                                if (!retried.ok) notifyOrderAction(r.name, retried.msg);
                            } else {
                                needsNewOrder = true;
                                notifyOrderAction(r.name, `정정 실패 - ${errMsg}`);
                            }
                        }
                    } else {
                        // 나머지 → 중복 취소
                        const resp = await fetch(`${ORDER_SERVER_URL}/api/cancel_order`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ stk_cd: r.code, orig_ord_no: o.ordNo, cncl_qty: o.remainQty }),
                        });
                        const data = await resp.json();
                        const ok = !(data.error || (data.return_code !== undefined && data.return_code !== 0));
                        if (!ok) { notifyOrderAction(r.name, `중복 주문 취소 실패 - ${data.error || data.return_msg}`); }
                    }
                } catch (e) {
                    needsNewOrder = true;
                    notifyOrderAction(r.name, `미체결 주문 처리 실패 - ${e.message}`);
                }
                await new Promise(resolve => setTimeout(resolve, 1100));
            }
            if (needsNewOrder) remaining.push(r);
        }
        return remaining;
    }

    function notifyOrderAction(name, msg) {
        // 일괄 처리 중간에 실패가 섞여도 흐름을 막지 않고, 마지막에 한 번에 알 수 있게 콘솔에 남긴다.
        console.warn(`[주문 처리] ${name}: ${msg}`);
    }

    // 목표금액(=기존 목표수량×기존가격)을 새 가격으로 나눠 수량을 다시 계산. 전량매도(targetQty=0)는 가격과 무관하게 보유수량 그대로 매도.
    // data.js의 주가가 며칠 전 기준이라 실시간가와 차이가 날 수 있는데, 내림 처리하면 목표 1주짜리 종목이
    // 가격이 살짝만 올라도 0주로 깎여버리므로 반올림 + 원래 목표가 있었다면 최소 1주는 보장한다.
    function recomputeRowWithFreshPrice(r, freshPrice) {
        if (!freshPrice) return null;
        // 상·하한가 범위 내로 가격 클램핑 (당일 가격 제한 준수)
        const limits = priceLimitsByCode[r.code];
        let price = freshPrice;
        if (limits) {
            if (limits.upper && price > limits.upper) price = limits.upper;
            if (limits.lower && price < limits.lower) price = limits.lower;
        }
        if (r.targetQty === 0) {
            return { ...r, price, diff: -r.curQty, side: r.curQty > 0 ? 'sell' : '' };
        }
        const targetValue = r.targetQty * r.price;
        let newTargetQty = Math.round(targetValue / price);
        if (newTargetQty === 0 && r.targetQty > 0) newTargetQty = 1;
        const newDiff = newTargetQty - r.curQty;
        return { ...r, price, targetQty: newTargetQty, diff: newDiff, side: newDiff > 0 ? 'buy' : (newDiff < 0 ? 'sell' : '') };
    }

    async function handleSendOrder(code) {
        const statusEl = document.getElementById('invest-status');
        const baseRow = currentInvestOrders.find(r => r.code === code);
        if (!baseRow) {
            statusEl.textContent = '주문 대상을 찾을 수 없습니다. 화면을 새로고침해주세요.';
            return;
        }
        let row;
        try {
            const prices = await fetchFreshQuotes([code]);
            row = recomputeRowWithFreshPrice(baseRow, prices[code]);
        } catch (e) {
            statusEl.textContent = `❌ 현재가 재조회 실패 - ${e.message}`;
            return;
        }
        if (!row || row.diff === 0) {
            statusEl.textContent = '현재가 기준으로 재계산한 결과 주문할 수량이 없습니다 (0주).';
            return;
        }
        statusEl.textContent = '기존 미체결 주문 확인/정정 중...';
        let remaining;
        try {
            remaining = await reconcileOpenOrdersAndFilter([row]);
        } catch (e) {
            statusEl.textContent = `❌ 미체결 주문 확인 실패 - ${e.message} (중복주문 위험으로 전송을 중단합니다)`;
            return;
        }
        if (remaining.length === 0) {
            statusEl.textContent = '✅ 기존 미체결 주문을 정정했습니다 (새 주문 없음).';
            await handleFetchHoldings();
            return;
        }
        row = remaining[0];
        const finalSide = row.diff > 0 ? 'buy' : 'sell';
        let finalQty = Math.abs(row.diff);
        let finalPrice = row.price;
        let partialNote = '';
        if (finalSide === 'buy') {
            // 보내고 실패하면 그때 줄이는 방식은 "매번 첫 시도는 무조건 실패"가 되어 답답하므로,
            // 보내기 전에 딱 한 번 최신 가격·매수가능수량을 확인해 처음부터 맞는 수량으로 보낸다.
            const { price: freshPrice, maxQty } = await fetchFreshAffordableQty(code);
            if (freshPrice) finalPrice = freshPrice;
            if (maxQty <= 0) {
                statusEl.textContent = `자금 부족 - ${row.name} 매수 가능 수량이 없습니다. (현재가 ${formatNumber(finalPrice)}원 기준)`;
                return;
            }
            if (maxQty < finalQty) {
                finalQty = maxQty;
                partialNote = `\n(매수가능수량 기준으로 목표 ${Math.abs(row.diff)}주 중 ${finalQty}주로 조정됨)`;
            }
            // 단기과열/투자경고(잠정·가역) 확인 — 관리종목/거래정지/정리매매/투자위험(확정·비가역)은
            // 서버 /api/order가 어느 경로든 동일하게 차단하므로 여기서 중복 체크하지 않는다.
            try {
                const warnResp = await fetch(`${ORDER_SERVER_URL}/api/stock_warnings?codes=${code}`);
                const warnings = await warnResp.json();
                if (['3', '5'].includes((warnings[code] || {}).orderWarning)) {
                    if (!confirm(`⚠️ ${row.name}은(는) 투자경고/단기과열 상태입니다.\n계속 진행하시겠습니까?`)) return;
                }
            } catch (e) {
                // 체크 실패 시 그냥 진행 — 확정·비가역 항목은 서버가 어차피 막아준다
            }
        }
        if (!confirm(`${finalSide === 'buy' ? '매수' : '매도'} 주문을 실제로 전송합니다. (현재가로 재계산됨)\n${row.name}(${code}) / 수량: ${finalQty}주 / 가격: ${finalPrice}원${partialNote}\n계속하시겠습니까?`)) return;
        try {
            const resp = await fetch(`${ORDER_SERVER_URL}/api/order`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ stk_cd: code, qty: finalQty, side: finalSide, price: finalPrice }),
            });
            const data = await resp.json();
            if (data.error || (data.return_code !== undefined && data.return_code !== 0)) {
                const errMsg = data.error || data.return_msg || '';
                if (finalSide === 'buy') {
                    // 그새 또 가격이 움직여 방금 확인한 수량도 거부된 경우에 대한 마지막 안전망
                    const retried = await retryBuyWithAffordableQty(
                        { name: row.name, code, price: finalPrice, diff: finalQty }, errMsg
                    );
                    alert(retried.ok ? `주문이 전송되었습니다. (${retried.msg})` : `주문 실패: ${retried.msg}`);
                    if (retried.ok) await handleFetchHoldings();
                } else {
                    alert(`주문 실패: ${errMsg}`);
                }
            } else {
                alert(`${row.name}(${code}) 주문이 전송되었습니다.`);
                await handleFetchHoldings();
            }
        } catch (e) {
            alert(`주문 전송 중 오류: ${e.message}`);
        }
    }

    // 종목의 현재가와, 그 가격 기준 매수가능수량을 함께 새로 조회한다.
    // 가격이 계속 움직이는 중이면 오래된 가격으로 수량을 계산해도 의미가 없으므로 항상 같이 갱신한다.
    async function fetchFreshAffordableQty(code) {
        let price = null;
        try {
            const prices = await fetchFreshQuotes([code]);  // 부수 효과로 priceLimitsByCode[code]도 갱신됨
            price = prices[code] || null;
        } catch (e) { /* 시세 재조회 실패 시 가격은 이전 값 유지 */ }
        if (!price) return { price: null, maxQty: 0 };
        // 정규장 매수는 최유리지정가(가격 미지정)로 나가는데, 키움은 이때 증거금을 "현재가"가 아니라
        // "상한가" 기준으로 미리 확보한다. 현재가로 매수가능수량을 물어보면 실제보다 더 많이 살 수
        // 있다고 착각하게 되어 항상 거부되므로, 상한가를 기준으로 조회해야 실제 가능 수량이 나온다.
        const upper = (priceLimitsByCode[code] && priceLimitsByCode[code].upper) || price;
        try {
            const resp = await fetch(`${ORDER_SERVER_URL}/api/order_possible_qty?stk_cd=${code}&price=${upper}&trde_tp=2`);
            const data = await resp.json();
            return { price, maxQty: data.max_qty || 0 };
        } catch (e) {
            return { price, maxQty: 0 };
        }
    }

    // 매수 주문이 증거금/자금 부족으로 거부됐을 때, 실제 매수 가능 수량(kt00010)을 조회해서
    // 그 수량으로 재주문할지 사용자에게 물어본다. 부족 사유가 아니면 그대로 실패 처리.
    async function retryBuyWithAffordableQty(r, errMsg) {
        if (!/부족/.test(errMsg)) {
            return { name: r.name, ok: false, msg: errMsg };
        }
        let { price: curPrice, maxQty } = await fetchFreshAffordableQty(r.code);
        if (!curPrice) curPrice = r.price;  // 시세 재조회 실패 시 기존 가격으로라도 시도

        if (maxQty <= 0) {
            return { name: r.name, ok: false, msg: `${errMsg} (매수 가능 수량 없음)` };
        }
        const origQty = Math.abs(r.diff);
        const retryQty = Math.min(maxQty, origQty);  // kt00010 조회값이 목표수량보다 커도 원래 목표 이상은 주문하지 않음
        const confirmMsg = retryQty < origQty
            ? `${r.name}: ${errMsg}\n\n목표 ${origQty}주 중 매수 가능한 ${retryQty}주로 대신 주문하시겠습니까? (현재가 ${formatNumber(curPrice)}원 기준)`
            : `${r.name}: ${errMsg}\n\n재조회 결과 ${retryQty}주 매수가 가능한 것으로 확인됩니다. 다시 주문하시겠습니까? (현재가 ${formatNumber(curPrice)}원 기준)`;
        if (!confirm(confirmMsg)) {
            return { name: r.name, ok: false, msg: `${errMsg} (사용자가 재주문 취소)` };
        }

        // 확인창을 띄우고 사용자가 응답하는 동안에도 시세가 움직일 수 있으므로,
        // 전송 직전에 가격·수량을 한 번 더 갱신한다. 급등락 중이면 최대 3회까지 반복한다.
        let attemptQty = retryQty;
        let attemptPrice = curPrice;
        for (let attempt = 1; attempt <= 3; attempt++) {
            try {
                const resp = await fetch(`${ORDER_SERVER_URL}/api/order`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ stk_cd: r.code, qty: attemptQty, side: 'buy', price: attemptPrice }),
                });
                const data = await resp.json();
                const ok = !(data.error || (data.return_code !== undefined && data.return_code !== 0));
                if (ok) {
                    const successMsg = attemptQty < origQty ? `성공 (${attemptQty}주로 축소 매수)` : '성공 (재주문)';
                    return { name: r.name, ok: true, msg: successMsg };
                }
                const retryErrMsg = data.error || data.return_msg || '';
                if (!/부족/.test(retryErrMsg) || attempt === 3) {
                    return { name: r.name, ok: false, msg: retryErrMsg };
                }
                // 계속 부족하면 가격·매수가능수량을 다시 갱신해서 재시도
                const fresh = await fetchFreshAffordableQty(r.code);
                const freshMaxQty = fresh.maxQty;
                if (fresh.price) attemptPrice = fresh.price;
                if (freshMaxQty <= 0 || freshMaxQty >= attemptQty) {
                    return { name: r.name, ok: false, msg: `${retryErrMsg} (매수 가능 수량 갱신 실패)` };
                }
                attemptQty = freshMaxQty;
            } catch (e) {
                return { name: r.name, ok: false, msg: e.message };
            }
        }
        return { name: r.name, ok: false, msg: '반복된 자금 부족으로 재시도를 중단했습니다.' };
    }

    async function handleSendAllOrders() {
        const statusEl = document.getElementById('invest-status');
        const rows = currentInvestOrders.filter(r => r.diff !== 0);
        if (rows.length === 0) {
            statusEl.textContent = '주문할 종목이 없습니다.';
            return;
        }
        statusEl.textContent = '현재가 재조회 중...';
        let prices;
        try {
            prices = await fetchFreshQuotes(rows.map(r => r.code));
        } catch (e) {
            statusEl.textContent = `❌ 현재가 재조회 실패 - ${e.message}`;
            return;
        }

        // 추가투자(buy-only): 가격만 업데이트, 리밸런싱: targetQty 재계산
        const recomputedRows = calcMode === 'addorder'
            ? rows.map(r => ({ ...r, price: prices[r.code] || r.price })).filter(r => r.diff > 0)
            : rows
                .map(r => recomputeRowWithFreshPrice(r, prices[r.code]))
                .filter(r => r && r.diff !== 0)
                .sort((a, b) => (a.diff < 0 ? 0 : 1) - (b.diff < 0 ? 0 : 1));

        if (recomputedRows.length === 0) {
            statusEl.textContent = '현재가 기준으로 재계산한 결과 주문할 종목이 없습니다.';
            return;
        }

        statusEl.textContent = '기존 미체결 주문 확인/정정 중...';
        let finalRows;
        try {
            finalRows = await reconcileOpenOrdersAndFilter(recomputedRows);
        } catch (e) {
            statusEl.textContent = `❌ 미체결 주문 확인 실패 - ${e.message} (중복주문 위험으로 전송을 중단합니다)`;
            return;
        }

        if (finalRows.length === 0) {
            statusEl.textContent = `✅ 기존 미체결 주문 ${recomputedRows.length}건을 모두 정정했습니다 (새 주문 없음).`;
            await handleFetchHoldings();
            return;
        }

        const listText = finalRows.map(r => `${r.name}: ${r.diff > 0 ? '매수' : '매도'} ${Math.abs(r.diff)}주 (${formatNumber(r.price)}원)`).join('\n');
        const modifiedCount = recomputedRows.length - finalRows.length;
        const modifiedNote = modifiedCount > 0 ? `\n(${modifiedCount}건은 기존 미체결 주문 정정으로 처리됨)` : '';
        if (!confirm(`아래 ${finalRows.length}건의 주문을 현재가로 재계산해 순차적으로 실제 전송합니다.${modifiedNote}\n\n${listText}\n\n계속하시겠습니까?`)) return;

        const sellRows = finalRows.filter(r => r.diff < 0);
        let buyRows    = finalRows.filter(r => r.diff > 0);
        const results = [];

        // 매수 대상 종목 중 단기과열/투자경고(잠정·가역) 사전 확인 — 관리종목/거래정지/정리매매/투자위험
        // (확정·비가역)은 서버 /api/order가 어느 경로든 동일하게 차단하므로 여기서 중복 체크하지 않는다.
        if (buyRows.length > 0) {
            statusEl.textContent = '매수 종목 투자유의 여부 확인 중...';
            try {
                const warnResp = await fetch(`${ORDER_SERVER_URL}/api/stock_warnings?codes=${buyRows.map(r => r.code).join(',')}`);
                const warnings = await warnResp.json();
                const cautioned = buyRows.filter(r => ['3', '5'].includes((warnings[r.code] || {}).orderWarning));
                if (cautioned.length > 0) {
                    const names = cautioned.map(r => `${r.name}(단기과열/투자경고)`).join(', ');
                    if (!confirm(`⚠️ 아래 종목은 투자경고/단기과열 상태입니다:\n${names}\n\n계속 진행하시겠습니까?`)) return;
                }
            } catch (e) {
                // 체크 실패 시 그냥 진행 (네트워크 오류 등) — 확정·비가역 항목은 서버가 어차피 막아준다
            }
        }

        // ① 매도 먼저 전송
        for (const r of sellRows) {
            statusEl.textContent = `매도 전송 중... (${results.length + 1}/${finalRows.length}) ${r.name}`;
            try {
                const resp = await fetch(`${ORDER_SERVER_URL}/api/order`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ stk_cd: r.code, qty: Math.abs(r.diff), side: 'sell', price: r.price }),
                });
                const data = await resp.json();
                const ok = !(data.error || (data.return_code !== undefined && data.return_code !== 0));
                results.push({ name: r.name, ok, msg: ok ? '성공' : (data.error || data.return_msg) });
            } catch (e) {
                results.push({ name: r.name, ok: false, msg: e.message });
            }
            await new Promise(resolve => setTimeout(resolve, 1100));
        }

        // ② 매도 전송 직후 — 매수 수량은 이미 위에서 계산되어 있고 자금 체크도 하지 않으므로
        // 여기서 보유내역 REST 재조회(kt00018 등 7개 호출)를 기다릴 필요가 없다.
        // 화면 표시용으로만 백그라운드에서 가볍게 갱신하고, 매수 전송은 즉시 이어간다.
        if (buyRows.length > 0) {
            applyRealtimeQuotes();
        }

        // ③ 매수 주문 전송 — 보내기 전에 매수가능수량을 한 번 확인해 처음부터 맞는 수량으로 보낸다
        // (실패 후에 줄이는 방식은 매번 첫 시도가 무조건 실패하는 것처럼 보여 혼란을 줌).
        for (const r of buyRows) {
            const origQty = Math.abs(r.diff);
            statusEl.textContent = `매수 전송 중... (${results.length + 1}/${finalRows.length}) ${r.name}`;
            try {
                const { price: freshPrice, maxQty } = await fetchFreshAffordableQty(r.code);
                const price = freshPrice || r.price;
                if (maxQty <= 0) {
                    results.push({ name: r.name, ok: false, msg: `자금 부족 (매수 가능 수량 없음, 현재가 ${formatNumber(price)}원 기준)` });
                    await new Promise(resolve => setTimeout(resolve, 1100));
                    continue;
                }
                const qty = Math.min(maxQty, origQty);
                const resp = await fetch(`${ORDER_SERVER_URL}/api/order`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ stk_cd: r.code, qty, side: 'buy', price }),
                });
                const data = await resp.json();
                const ok = !(data.error || (data.return_code !== undefined && data.return_code !== 0));
                if (ok) {
                    const msg = qty < origQty ? `성공 (매수가능수량 기준 ${qty}주로 조정)` : '성공';
                    results.push({ name: r.name, ok: true, msg });
                } else {
                    const errMsg = data.error || data.return_msg || '';
                    // 확인 직후에도 또 가격이 움직여 거부된 경우에 대한 마지막 안전망
                    const retried = await retryBuyWithAffordableQty({ ...r, price, diff: qty }, errMsg);
                    results.push(retried);
                }
            } catch (e) {
                results.push({ name: r.name, ok: false, msg: e.message });
            }
            await new Promise(resolve => setTimeout(resolve, 1100));
        }

        const successCount = results.filter(r => r.ok).length;
        const skippedCount = results.filter(r => !r.ok && r.msg.includes('건너뜀')).length;
        statusEl.textContent = `✅ 일괄 주문 완료: 성공 ${successCount}/${finalRows.length}건`
            + (skippedCount > 0 ? ` / 자금부족 건너뜀 ${skippedCount}건` : '')
            + (results.filter(r => !r.ok && !r.msg.includes('건너뜀')).length > 0
                ? ` (실패: ${results.filter(r => !r.ok && !r.msg.includes('건너뜀')).map(r => `${r.name}(${r.msg})`).join(', ')})` : '');
        await handleFetchHoldings();

        // 주문 완료 텔레그램 알림
        if (successCount > 0) {
            const orderLines = results.map(r => `${r.ok ? '✅' : '❌'} ${r.name}: ${r.msg}`).join('\n');
            fetch(`${ORDER_SERVER_URL}/api/notify`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: `🛒 일괄 주문 완료 (${new Date().toLocaleTimeString()})\n성공 ${successCount}/${finalRows.length}건\n\n${orderLines}` }),
            }).catch(() => {});
        }

        // 주문 완료 후 성과추적 기준점 자동저장
        if (successCount > 0 && portfolioNames.length > 0) {
            try {
                const baselineStocks = portfolioNames.map(name => {
                    const code = findStockCode(name);
                    const held = code ? holdingsByCode[code] : null;
                    return { name, code, qty: held ? held.qty : 0, price: held ? held.price : findStockPrice(name) };
                }).filter(s => s.code);
                await fetch(`${ORDER_SERVER_URL}/api/performance/baseline`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ stocks: baselineStocks, totalInvestment: holdingsAccountInfo?.totalAsset }),
                });
                statusEl.textContent += ' / 📊 성과추적 기준점 자동저장 완료';
            } catch (e) {
                // 기준점 저장 실패는 치명적이지 않으므로 무시
            }
        }
    }

    // ===== 성과추적 메뉴 =====
    // 보유 내역을 조회해둔 상태면 "실제 체결된 보유종목" 기준으로, 아니면 포트폴리오 목표 기준으로 기준점을 만든다.
    // (리밸런싱 직후 바로 기록하면 실제 체결가가 아닌 목표가가 들어가므로, 주문 실행 후 기록하는 것을 권장)
    function buildBaselinePayload() {
        const recommendList = computeRecommendData();
        const ranksByName = new Map(recommendList.map(r => [r.name, r.ranks]));
        const usingHoldings = holdingsLoaded && Object.values(holdingsByCode).some(h => h.qty > 0);

        let stocks;
        if (usingHoldings) {
            stocks = Object.entries(holdingsByCode)
                .filter(([, h]) => h.qty > 0)
                .map(([code, h]) => ({ name: h.name, code, qty: h.qty, price: h.price, strategyRanks: ranksByName.get(h.name) || {} }));
        } else {
            stocks = computePortfolioData().filter(s => s.shares > 0)
                .map(s => ({ name: s.name, code: findStockCode(s.name), qty: s.shares, price: s.price, strategyRanks: ranksByName.get(s.name) || {} }))
                .filter(s => s.code);
        }
        const totalInvestment = usingHoldings ? stocks.reduce((sum, s) => sum + s.qty * s.price, 0) : portfolioInvestment;
        stocks.forEach(s => { s.weight = totalInvestment > 0 ? (s.qty * s.price) / totalInvestment : null; });
        return { totalInvestment, stocks, usingHoldings };
    }

        if (payload.stocks.length === 0) {

        statusEl.textContent = '기록 중...';
        try {
            const resp = await fetch(`${ORDER_SERVER_URL}/api/performance/baseline`, {

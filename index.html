    async function handleFetchHoldings(silent) {
        if (!silent) setHoldingsStatusText('조회 중...');
        try {
            // kt00018로 전체 보유 목록 조회 (stk_cntr_remn은 결제완료 종목만 반환해 누락 발생)
            const resp = await fetch(`${ORDER_SERVER_URL}/api/holdings`);
            const data = await resp.json();
            if (data.error || (data.return_code !== undefined && data.return_code !== 0)) {
                throw new Error(data.error || data.return_msg || '조회 실패');
            }
            holdingsByCode = {};
            (data.acnt_evlt_remn_indv_tot || []).forEach(r => {
                const code = (r.stk_cd || '').replace(/^A/, '');
                if (!code) return;
                const curP  = parseInt(r.cur_prc || r.cur_pric || '0', 10) || 0;
                const predP = parseInt(r.pred_close_pric || '0', 10) || 0;
                holdingsByCode[code] = {
                    name: r.stk_nm || '',
                    qty: parseInt(r.rmnd_qty || '0', 10) || 0,
                    trdeAbleQty: parseInt(r.trde_able_qty || '0', 10) || 0,  // 매매가능수량 (결제 완료분)
                    price: curP,
                    purPrice: parseInt(r.pur_pric || '0', 10) || 0,
                    purAmt:   parseInt(r.pur_amt  || '0', 10) || 0,
                    prftRt: parseFloat(r.prft_rt || '0') || 0,
                    evltvPrft: parseInt(r.evltv_prft || '0', 10) || 0,
                    possRt: parseFloat(r.poss_rt || '0') || 0,
                    fluRt: predP > 0 ? ((curP - predP) / predP * 100) : 0,
                    sumCmsn:  parseInt(r.sum_cmsn || '0', 10) || 0,
                    tax:      parseInt(r.tax      || '0', 10) || 0,
                    tdyBuyq:  parseInt(r.tdy_buyq  || '0', 10) || 0,
                    tdySellq: parseInt(r.tdy_sellq || '0', 10) || 0,
                    predBuyq: parseInt(r.pred_buyq  || '0', 10) || 0,
                    predSellq:parseInt(r.pred_sellq || '0', 10) || 0,
                };
            });
            const totalAsset = parseInt(data.prsm_dpst_aset_amt || '0', 10) || 0;
            const totalEval = parseInt(data.tot_evlt_amt || '0', 10) || 0;
            let ordAlowa = totalAsset - totalEval;  // kt00018 기본 현금 추정

            // kt00005로 정확한 주문가능현금(ord_alowa) 보완
            try {
                const resp5 = await fetch(`${ORDER_SERVER_URL}/api/settlement_balance`);
                const data5 = await resp5.json();
                if (!data5.error && data5.return_code === 0 && data5.ord_alowa) {
                    ordAlowa = parseInt(data5.ord_alowa, 10) || ordAlowa;
                }
            } catch (e) { /* kt00005 실패 시 kt00018 추정값 사용 */ }

            // kt00001 예수금 상세 (예수금/출금가능/주문가능/D+1~D+2)
            let depositInfo = null;
            try {
                const respDep = await fetch(`${ORDER_SERVER_URL}/api/deposit`);
                const dataDep = await respDep.json();
                if (!dataDep.error) {
                    depositInfo = {
                        entr:       parseInt(dataDep.entr || '0', 10) || 0,
                        pymnAlow:   parseInt(dataDep.pymn_alow_amt || '0', 10) || 0,
                        ordAlow:    parseInt(dataDep.ord_alow_amt || '0', 10) || 0,
                        d1Entr:     parseInt(dataDep.d1_entra || '0', 10) || 0,
                        d1PymnAlow: parseInt(dataDep.d1_pymn_alow_amt || '0', 10) || 0,
                        d2Entr:     parseInt(dataDep.d2_entra || '0', 10) || 0,
                    };
                    if (depositInfo.ordAlow > 0) ordAlowa = depositInfo.ordAlow;
                }
            } catch (e) { /* kt00001 실패 무시 */ }

            // kt00009 당일 약정금액
            let contractInfo = null;
            try {
                const respCt = await fetch(`${ORDER_SERVER_URL}/api/daily_contract`);
                const dataCt = await respCt.json();
                if (!dataCt.error && dataCt.total > 0) contractInfo = dataCt;
            } catch (e) { /* kt00009 실패 무시 */ }

            // kt00017 당일현황 추가 필드 (매도/매수금액, 수수료/세금, 배당금)
            let todayStatusInfo = null;
            try {
                const respTdy = await fetch(`${ORDER_SERVER_URL}/api/today_deposit`);
                const dataTdy = await respTdy.json();
                if (!dataTdy.error) {
                    todayStatusInfo = {
                        sellAmt:  parseInt(dataTdy.sell_amt  || '0', 10) || 0,
                        buyAmt:   parseInt(dataTdy.buy_amt   || '0', 10) || 0,
                        cmsn:     parseInt(dataTdy.cmsn      || '0', 10) || 0,
                        tax:      parseInt(dataTdy.tax       || '0', 10) || 0,
                        dividaAmt:parseInt(dataTdy.dvida_amt || '0', 10) || 0,
                    };
                }
            } catch (e) { /* kt00017 실패 무시 */ }

            // kt00008 익일 결제 예정 내역
            let settlementInfo = null;
            try {
                const respSetl = await fetch(`${ORDER_SERVER_URL}/api/next_day_settlement`);
                const dataSetl = await respSetl.json();
                if (!dataSetl.error) {
                    const rows = dataSetl.acnt_nxdy_setl_frcs_prps_array || [];
                    const totCmsn = rows.reduce((s, r) =>
                        s + (parseInt(r.cmsn||'0',10)||0)
                          + (parseInt(r.trde_tax||'0',10)||0)
                          + (parseInt(r.incm_tax||'0',10)||0)
                          + (parseInt(r.rstx||'0',10)||0)
                          + (parseInt(r.resi_tax||'0',10)||0), 0);
                    settlementInfo = {
                        sellSum: parseInt(dataSetl.sell_amt_sum||'0',10)||0,
                        buySum:  parseInt(dataSetl.buy_amt_sum||'0',10)||0,
                        totCmsn,
                        rows: rows.map(r => ({
                            name:    r.stk_nm || '',
                            tp:      (r.sell_tp||'').startsWith('1') ? '매도' : '매수',
                            exctAmt: parseInt(r.exct_amt||'0',10)||0,
                        })),
                    };
                }
            } catch (e) { /* kt00008 실패 무시 */ }

            // kt00004 계좌평가현황 (당일/당월/누적 손익 + 종목별 금일 매수/매도 수량)
            let acntEvalInfo = null;
            let acntEvalByCode = {};
            try {
                const respAcnt = await fetch(`${ORDER_SERVER_URL}/api/account_eval`);
                const dataAcnt = await respAcnt.json();
                if (!dataAcnt.error) {
                    acntEvalInfo = {
                        tdyLspft:    parseInt(dataAcnt.tdy_lspft || '0', 10) || 0,
                        tdyLspftRt:  parseFloat(dataAcnt.tdy_lspft_rt || '0') || 0,
                        lspft2:      parseInt(dataAcnt.lspft2 || '0', 10) || 0,
                        lspftRatio:  parseFloat(dataAcnt.lspft_ratio || '0') || 0,
                        lspft:       parseInt(dataAcnt.lspft || '0', 10) || 0,
                        lspftRt:     parseFloat(dataAcnt.lspft_rt || '0') || 0,
                    };
                    for (const s of (dataAcnt.stk_acnt_evlt_prst || [])) {
                        const cd = (s.stk_cd || '').replace(/^[AJQ]/, '');
                        acntEvalByCode[cd] = {
                            tdyBuyq:  parseInt(s.tdy_buyq || '0', 10) || 0,
                            tdySellq: parseInt(s.tdy_sellq || '0', 10) || 0,
                            predBuyq: parseInt(s.pred_buyq || '0', 10) || 0,
                            predSellq:parseInt(s.pred_sellq || '0', 10) || 0,
                        };
                    }
                }
            } catch (e) { /* kt00004 실패 무시 */ }

            holdingsAccountInfo = {
                totalAsset,               // prsm_dpst_aset_amt: 브로커 기준 추정예탁자산
                totalEval,
                cash: totalAsset - totalEval,  // 계좌 현금 = 총자산 - 평가금액
                ordAlowa,                 // 실제 주문가능현금(미체결 매수 차감 후) - 주문 한도 확인용
                totalPurchase: parseInt(data.tot_pur_amt || '0', 10) || 0,
                totalPL: parseInt(data.tot_evlt_pl || '0', 10) || 0,
                totalPrftRt: parseFloat(data.tot_prft_rt || '0') || 0,
                depositInfo,              // kt00001 예수금 상세
                contractInfo,             // kt00009 당일 약정금액
                todayStatusInfo,          // kt00017 당일 매도/매수/수수료/세금/배당
                settlementInfo,           // kt00008 익일 결제 예정
                acntEvalInfo,             // kt00004 당일/당월/누적 손익
                acntEvalByCode,           // kt00004 종목별 금일 매수/매도 수량
            };
            // silent=true(주문 실행 중 내부 호출)일 때는 투자금 기준을 고정 - 주문 중 재계산으로 목표수량이 변하는 것을 방지
            if (!silent) {
                portfolioBaseAmount = holdingsAccountInfo.totalAsset;
                recomputePortfolioInvestment();
            }
            holdingsLoaded = true;

            // 목표 종목 중 아직 보유하지 않은 종목도 실시간 시세를 같이 받아온다 (데이터 며칠 전 주가 대신)
            const unheldCodes = portfolioNames
                .map(name => findStockCode(name))
                .filter(code => code && !holdingsByCode[code]);
            if (unheldCodes.length > 0) {
                try {
                    const freshPrices = await fetchFreshQuotes(unheldCodes);
                    Object.assign(freshPriceByCode, freshPrices);
                } catch (e) {
                    // 미보유 종목 시세 조회 실패는 치명적이지 않으므로 무시하고 기존 주가로 계산
                }
            }

            setHoldingsStatusText(`조회 완료 (${Object.keys(holdingsByCode).length}종목 보유, ${new Date().toLocaleTimeString()} 기준)`);
            startOrderPolling();
        } catch (e) {
            holdingsLoaded = false;
            setHoldingsStatusText(`❌ 로컬 주문 서버에 연결할 수 없습니다. (python order_server.py 실행 필요) - ${e.message}`);
            stopOrderPolling();
        }
        refreshCurrentTable();
    }

    // 목표 비중(포트폴리오 메뉴에서 계산한 균등비중 목표수량) vs 현재 보유수량을 비교해 매수/매도 수량을 산출
    function computeOrderData() {
        const targets = computePortfolioData();  // [{name, price, shares, rank}, ...]
        const rows = [];
        const seenCodes = new Set();

        targets.forEach(t => {
            const code = findStockCode(t.name);
            if (!code) return;
            seenCodes.add(code);
            const held = holdingsByCode[code];
            const curQty = held ? held.qty : 0;
            // 매도 시 실제 가능 수량은 trdeAbleQty (D+2 미결제분 제외)
            const sellableQty = held ? (held.trdeAbleQty > 0 ? held.trdeAbleQty : held.qty) : 0;
            const rawDiff = t.shares - curQty;
            const diff = rawDiff < 0 ? Math.max(rawDiff, -sellableQty) : rawDiff;
            const targetValue = t.shares * t.price;
            const curValue = curQty * t.price;
            // 매수/매도 수량(diff)과 부호를 통일: 음수 = 매도 필요, 양수 = 매수 필요
            const weightDiffPct = targetValue > 0 ? ((targetValue - curValue) / targetValue) * 100 : (curValue > 0 ? -100 : 0);
            rows.push({
                name: t.name, code, price: t.price,
                targetQty: t.shares, curQty, diff, weightDiffPct,
                side: diff > 0 ? 'buy' : (diff < 0 ? 'sell' : ''),
            });
        });

        // 목표에는 없지만 현재 보유 중인 종목 (전량 매도 후보)
        Object.keys(holdingsByCode).forEach(code => {
            if (seenCodes.has(code)) return;
            const held = holdingsByCode[code];
            if (held.qty <= 0) return;
            const sellableQty = held.trdeAbleQty > 0 ? held.trdeAbleQty : held.qty;
            if (sellableQty <= 0) return;
            rows.push({
                name: held.name, code, price: held.price,
                targetQty: 0, curQty: held.qty, diff: -sellableQty, weightDiffPct: -100, side: 'sell',
            });
        });

        checkWeightDeviations(rows);
        return rows;
    }

    function checkWeightDeviations(rows) {
        rows.forEach(r => {
            const exceeded = Math.abs(r.weightDiffPct) >= WEIGHT_DEVIATION_ALERT_PCT;
            if (exceeded && !notifiedDeviationCodes.has(r.code)) {
                notifiedDeviationCodes.add(r.code);
                notify('목표 비중 이탈', `${r.name}: 목표 대비 ${r.weightDiffPct > 0 ? '+' : ''}${r.weightDiffPct.toFixed(1)}% 차이`);
            } else if (!exceeded && notifiedDeviationCodes.has(r.code)) {
                notifiedDeviationCodes.delete(r.code);
            }
        });
    }

    async function fetchFreshQuotes(codes) {
        const resp = await fetch(`${ORDER_SERVER_URL}/api/quotes?codes=${codes.join(',')}`);
        const data = await resp.json();
        if (data.error) throw new Error(data.error);
        // 응답에서 가격만 추출해 {code: price} 형태로 반환하고, 상·하한가는 전역 캐시에 저장
        const prices = {};
        Object.entries(data.prices || {}).forEach(([code, val]) => {
            if (val && typeof val === 'object') {
                prices[code] = val.price;
                priceLimitsByCode[code] = {
                    upper: val.upper_limit,
                    lower: val.lower_limit,
                    exp: val.exp_price,
                };
                if (val.flu_rt != null) fluRtByCode[code] = val.flu_rt;
            } else {
                prices[code] = val;  // 구형 응답 폴백
            }
        });
        return prices;  // {code: price}
    }

    // ka10076(체결요청)으로 미체결 주문을 조회한다.
    // oso_qty(미체결수량) 필드가 직접 제공되어 kt00009보다 정확하고 단순하다.
    // ord_stt(주문상태)로 실제 살아있는 주문만 필터링 가능.
    // kt00007(계좌별주문체결내역상세, qry_tp=3 미체결만) 로 미체결 주문을 조회한다.
    // API가 미체결만 반환하므로 별도 필터링 불필요, ord_remnq(주문잔량) 직접 사용.
    async function fetchOpenOrders() {
        const resp = await fetch(`${ORDER_SERVER_URL}/api/open_orders`);
        const data = await resp.json();
        if (data.error) throw new Error(data.error);
        const rows = data.acnt_ord_cntr_prps_dtl || [];
        return rows
            .map(r => ({
                code: (r.stk_cd || '').replace(/\D/g, ''),
                name: r.stk_nm || '',
                ordNo: r.ord_no,
                side: (r.io_tp_nm || '').includes('매도') ? 'sell' : ((r.io_tp_nm || '').includes('매수') ? 'buy' : null),
                ordQty: parseInt(r.ord_qty, 10) || 0,
                cntrQty: parseInt(r.cntr_qty, 10) || 0,
                ordPrice: parseInt(r.ord_uv, 10) || 0,
                remainQty: parseInt(r.ord_remnq, 10) || 0,
            }))
            .filter(r => r.code && r.ordNo && r.remainQty > 0);
    }

    // 특정 종목코드들의 매도 미체결이 모두 소진될 때까지 대기 (최대 5분, 10초 간격)
    async function waitForSellsFilled(sellCodes, statusEl) {
        const maxTries = 30;  // 10초 × 30 = 5분
        for (let i = 0; i < maxTries; i++) {
            await new Promise(r => setTimeout(r, 10000));
            try {
                const open = await fetchOpenOrders();
                const pendingSells = open.filter(o => o.side === 'sell' && sellCodes.includes(o.code));
                if (pendingSells.length === 0) return true;
                const remaining = pendingSells.map(o => `${o.name||o.code}(${o.remainQty}주)`).join(', ');
                if (statusEl) statusEl.textContent = `매도 체결 대기 중... (${i+1}/${maxTries}) 미체결: ${remaining}`;
            } catch (e) {
                // 조회 실패 시 계속 대기
            }
        }
        return false;  // 타임아웃
    }

    // 주문 실행 화면 하단에 현재 미체결 주문 현황을 표로 보여준다.
    async function renderOpenOrdersSection() {
        const section = document.getElementById('open-orders-section');
        const table = document.getElementById('open-orders-table');
        if (!section || !table) return;
        let openOrders;
        try {
            openOrders = await fetchOpenOrders();
        } catch (e) {
            section.style.display = 'none';
            return;
        }
        hasOpenOrders = openOrders.length > 0;
        // 미체결 현황이 바뀌면 포트폴리오 요약도 갱신 (1위 추가매수 활성/비활성 반영)
        if (currentMenu === 'rebalance') renderPortfolioSummary();
        if (openOrders.length === 0) {
            section.style.display = 'none';
            return;
        }
        section.style.display = 'block';
        let html = `<thead><tr>
            <th style="text-align:left;">종목명</th><th>매수/매도</th><th>주문수량</th><th>체결수량</th><th>미체결수량</th><th>주문가</th>
        </tr></thead><tbody>`;
        openOrders.forEach(o => {
            const sideLabel = o.side === 'buy' ? '<span style="color:#dc2626;">매수</span>' : (o.side === 'sell' ? '<span style="color:#2563eb;">매도</span>' : '-');
            html += `<tr>
                <td style="text-align:left;">${o.name}</td>
                <td>${sideLabel}</td>
                <td>${formatNumber(o.ordQty)}주</td>
                <td>${formatNumber(o.cntrQty)}주</td>
                <td>${formatNumber(o.remainQty)}주</td>
                <td>${formatNumber(o.ordPrice)}원</td>
            </tr>`;
        });
        html += `</tbody>`;
        table.innerHTML = html;
    }

    // 보낼 주문(rows)별로 같은 종목의 미체결 주문이 있으면: 같은 방향이면 정정주문(수량/가격만 갱신)으로 처리하고,
    // 방향이 다르면 취소한다. 정정으로 완전히 처리된 행은 결과 배열에서 제외해서 새 주문을 또 보내지 않게 한다.
    async function reconcileOpenOrdersAndFilter(rows) {
        const codeSet = new Set(rows.map(r => r.code));
        const openOrders = (await fetchOpenOrders()).filter(o => codeSet.has(o.code));
        const remaining = [];
        for (const r of rows) {
            const matchingOpenOrders = openOrders.filter(o => o.code === r.code);
            if (matchingOpenOrders.length === 0) {
                remaining.push(r);
                continue;
            }
            // 같은 방향 주문이 2건 이상이면 첫 번째만 정정하고 나머지는 중복이므로 취소
            const sameSide = matchingOpenOrders.filter(o => o.side === r.side);
            const oppSide = matchingOpenOrders.filter(o => o.side !== r.side);
            let needsNewOrder = false;

            // 반대 방향 주문 전부 취소
            for (const o of oppSide) {
                try {
                    const resp = await fetch(`${ORDER_SERVER_URL}/api/cancel_order`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ stk_cd: r.code, orig_ord_no: o.ordNo, cncl_qty: o.remainQty }),
                    });
                    const data = await resp.json();
                    const ok = !(data.error || (data.return_code !== undefined && data.return_code !== 0));
                    needsNewOrder = true;
                    if (!ok) { notifyOrderAction(r.name, `방향 변경으로 인한 기존 주문 취소 실패 - ${data.error || data.return_msg}`); }
                } catch (e) {
                    needsNewOrder = true;
                    notifyOrderAction(r.name, `미체결 주문 처리 실패 - ${e.message}`);
                }
                await new Promise(resolve => setTimeout(resolve, 1100));
            }

            // 같은 방향: 첫 번째만 정정, 나머지 중복 주문은 취소
            for (let i = 0; i < sameSide.length; i++) {
                const o = sameSide[i];
                try {
                    if (i === 0) {
                        // 첫 번째 → 정정
                        const resp = await fetch(`${ORDER_SERVER_URL}/api/modify_order`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ stk_cd: r.code, orig_ord_no: o.ordNo, mdfy_qty: Math.abs(r.diff), mdfy_uv: r.price }),
                        });
                        const data = await resp.json();
                        const ok = !(data.error || (data.return_code !== undefined && data.return_code !== 0));
                        if (!ok) { needsNewOrder = true; notifyOrderAction(r.name, `정정 실패 - ${data.error || data.return_msg}`); }
                    } else {
                        // 나머지 → 중복 취소
                        const resp = await fetch(`${ORDER_SERVER_URL}/api/cancel_order`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ stk_cd: r.code, orig_ord_no: o.ordNo, cncl_qty: o.remainQty }),
                        });
                        const data = await resp.json();
                        const ok = !(data.error || (data.return_code !== undefined && data.return_code !== 0));
                        if (!ok) { notifyOrderAction(r.name, `중복 주문 취소 실패 - ${data.error || data.return_msg}`); }
                    }
                } catch (e) {
                    needsNewOrder = true;
                    notifyOrderAction(r.name, `미체결 주문 처리 실패 - ${e.message}`);
                }
                await new Promise(resolve => setTimeout(resolve, 1100));
            }
            if (needsNewOrder) remaining.push(r);
        }
        return remaining;
    }

    function notifyOrderAction(name, msg) {
        // 일괄 처리 중간에 실패가 섞여도 흐름을 막지 않고, 마지막에 한 번에 알 수 있게 콘솔에 남긴다.
        console.warn(`[주문 처리] ${name}: ${msg}`);
    }

    // 목표금액(=기존 목표수량×기존가격)을 새 가격으로 나눠 수량을 다시 계산. 전량매도(targetQty=0)는 가격과 무관하게 보유수량 그대로 매도.
    // data.js의 주가가 며칠 전 기준이라 실시간가와 차이가 날 수 있는데, 내림 처리하면 목표 1주짜리 종목이
    // 가격이 살짝만 올라도 0주로 깎여버리므로 반올림 + 원래 목표가 있었다면 최소 1주는 보장한다.
    function recomputeRowWithFreshPrice(r, freshPrice) {
        if (!freshPrice) return null;
        // 상·하한가 범위 내로 가격 클램핑 (당일 가격 제한 준수)
        const limits = priceLimitsByCode[r.code];
        let price = freshPrice;
        if (limits) {
            if (limits.upper && price > limits.upper) price = limits.upper;
            if (limits.lower && price < limits.lower) price = limits.lower;
        }
        if (r.targetQty === 0) {
            return { ...r, price, diff: -r.curQty, side: r.curQty > 0 ? 'sell' : '' };
        }
        const targetValue = r.targetQty * r.price;
        let newTargetQty = Math.round(targetValue / price);
        if (newTargetQty === 0 && r.targetQty > 0) newTargetQty = 1;
        const newDiff = newTargetQty - r.curQty;
        return { ...r, price, targetQty: newTargetQty, diff: newDiff, side: newDiff > 0 ? 'buy' : (newDiff < 0 ? 'sell' : '') };
    }

    async function handleSendOrder(code) {
        const statusEl = document.getElementById('order-server-status');
        const baseRow = computeOrderData().find(r => r.code === code);
        if (!baseRow) {
            statusEl.textContent = '주문 대상을 찾을 수 없습니다. 화면을 새로고침해주세요.';
            return;
        }
        let row;
        try {
            const prices = await fetchFreshQuotes([code]);
            row = recomputeRowWithFreshPrice(baseRow, prices[code]);
        } catch (e) {
            statusEl.textContent = `❌ 현재가 재조회 실패 - ${e.message}`;
            return;
        }
        if (!row || row.diff === 0) {
            statusEl.textContent = '현재가 기준으로 재계산한 결과 주문할 수량이 없습니다 (0주).';
            return;
        }
        statusEl.textContent = '기존 미체결 주문 확인/정정 중...';
        let remaining;
        try {
            remaining = await reconcileOpenOrdersAndFilter([row]);
        } catch (e) {
            statusEl.textContent = `❌ 미체결 주문 확인 실패 - ${e.message} (중복주문 위험으로 전송을 중단합니다)`;
            return;
        }
        if (remaining.length === 0) {
            statusEl.textContent = '✅ 기존 미체결 주문을 정정했습니다 (새 주문 없음).';
            await handleFetchHoldings();
            return;
        }
        row = remaining[0];
        const finalSide = row.diff > 0 ? 'buy' : 'sell';
        let finalQty = Math.abs(row.diff);
        let partialNote = '';
        if (finalSide === 'buy' && holdingsAccountInfo) {
            const ordAlowa = holdingsAccountInfo.ordAlowa || 0;  // kt00005 주문가능현금 (증거금율 반영된 실제 한도)
            const affordableQty = Math.floor(ordAlowa / row.price);
            if (affordableQty <= 0) {
                statusEl.textContent = `자금 부족 - 주문가능현금 ${formatNumber(ordAlowa)}원 / 주당 ${formatNumber(row.price)}원`;
                return;
            }
            if (affordableQty < finalQty) {
                finalQty = affordableQty;
                partialNote = `\n(주문가능현금 부족으로 목표 ${Math.abs(row.diff)}주 중 ${finalQty}주만 매수)`;
            }
        }
        if (!confirm(`${finalSide === 'buy' ? '매수' : '매도'} 주문을 실제로 전송합니다. (현재가로 재계산됨)\n종목코드: ${code} / 수량: ${finalQty}주 / 가격: ${row.price}원${partialNote}\n계속하시겠습니까?`)) return;
        try {
            const resp = await fetch(`${ORDER_SERVER_URL}/api/order`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ stk_cd: code, qty: finalQty, side: finalSide, price: row.price }),
            });
            const data = await resp.json();
            if (data.error || (data.return_code !== undefined && data.return_code !== 0)) {
                alert(`주문 실패: ${data.error || data.return_msg}`);
            } else {
                alert('주문이 전송되었습니다.');
                await handleFetchHoldings();
            }
        } catch (e) {
            alert(`주문 전송 중 오류: ${e.message}`);
        }
    }

    async function handleSendAllOrders() {
        const statusEl = document.getElementById('order-server-status');
        const rows = (pendingAddOrders && pendingAddOrders.length > 0)
            ? pendingAddOrders.map(o => ({ ...o, diff: o.qty }))
            : computeOrderData().filter(r => r.diff !== 0);
        if (rows.length === 0) {
            statusEl.textContent = '주문할 종목이 없습니다.';
            return;
        }
        statusEl.textContent = '현재가 재조회 중...';
        let prices;
        try {
            prices = await fetchFreshQuotes(rows.map(r => r.code));
        } catch (e) {
            statusEl.textContent = `❌ 현재가 재조회 실패 - ${e.message}`;
            return;
        }

        const recomputedRows = (pendingAddOrders && pendingAddOrders.length > 0)
            ? rows.map(r => ({ ...r, price: prices[r.code] || r.price, diff: r.qty })).filter(r => r.diff > 0)
            : rows
                .map(r => recomputeRowWithFreshPrice(r, prices[r.code]))
                .filter(r => r && r.diff !== 0)
                .sort((a, b) => (a.diff < 0 ? 0 : 1) - (b.diff < 0 ? 0 : 1));  // 매도(diff<0)를 먼저 보내서 현금을 확보한 뒤 매수

        if (recomputedRows.length === 0) {
            statusEl.textContent = '현재가 기준으로 재계산한 결과 주문할 종목이 없습니다.';
            return;
        }

        statusEl.textContent = '기존 미체결 주문 확인/정정 중...';
        let finalRows;
        try {
            finalRows = await reconcileOpenOrdersAndFilter(recomputedRows);
        } catch (e) {
            statusEl.textContent = `❌ 미체결 주문 확인 실패 - ${e.message} (중복주문 위험으로 전송을 중단합니다)`;
            return;
        }

        if (finalRows.length === 0) {
            statusEl.textContent = `✅ 기존 미체결 주문 ${recomputedRows.length}건을 모두 정정했습니다 (새 주문 없음).`;
            await handleFetchHoldings();
            return;
        }

        const listText = finalRows.map(r => `${r.name}: ${r.diff > 0 ? '매수' : '매도'} ${Math.abs(r.diff)}주 (${formatNumber(r.price)}원)`).join('\n');
        const modifiedCount = recomputedRows.length - finalRows.length;
        const modifiedNote = modifiedCount > 0 ? `\n(${modifiedCount}건은 기존 미체결 주문 정정으로 처리됨)` : '';
        if (!confirm(`아래 ${finalRows.length}건의 주문을 현재가로 재계산해 순차적으로 실제 전송합니다.${modifiedNote}\n\n${listText}\n\n계속하시겠습니까?`)) return;

        const sellRows = finalRows.filter(r => r.diff < 0);
        let buyRows    = finalRows.filter(r => r.diff > 0);
        const results = [];

        // 매수 대상 종목 투자유의 사전 체크 (ka10100)
        if (buyRows.length > 0) {
            statusEl.textContent = '매수 종목 투자유의 여부 확인 중...';
            try {
                const warnResp = await fetch(`${ORDER_SERVER_URL}/api/stock_warnings?codes=${buyRows.map(r => r.code).join(',')}`);
                const warnings = await warnResp.json();
                const blocked = buyRows.filter(r => ['2', '4'].includes((warnings[r.code] || {}).orderWarning));
                const cautioned = buyRows.filter(r => ['3', '5'].includes((warnings[r.code] || {}).orderWarning));
                if (blocked.length > 0) {
                    const names = blocked.map(r => r.name).join(', ');
                    if (!confirm(`⛔ 아래 종목은 정리매매/투자위험으로 매수 주문을 차단합니다:\n${names}\n\n나머지 종목만 진행하시겠습니까?`)) return;
                    blocked.forEach(r => results.push({ name: r.name, ok: false, msg: '투자유의종목 차단' }));
                    buyRows = buyRows.filter(r => !blocked.find(b => b.code === r.code));
                }
                if (cautioned.length > 0) {
                    const names = cautioned.map(r => `${r.name}(단기과열/투자경고)`).join(', ');
                    if (!confirm(`⚠️ 아래 종목은 투자경고/단기과열 상태입니다:\n${names}\n\n계속 진행하시겠습니까?`)) return;
                }
            } catch (e) {
                // 체크 실패 시 그냥 진행 (네트워크 오류 등)
            }
        }

        // ① 매도 먼저 전송
        for (const r of sellRows) {
            statusEl.textContent = `매도 전송 중... (${results.length + 1}/${finalRows.length}) ${r.name}`;
            try {
                const resp = await fetch(`${ORDER_SERVER_URL}/api/order`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ stk_cd: r.code, qty: Math.abs(r.diff), side: 'sell', price: r.price }),
                });
                const data = await resp.json();
                const ok = !(data.error || (data.return_code !== undefined && data.return_code !== 0));
                results.push({ name: r.name, ok, msg: ok ? '성공' : (data.error || data.return_msg) });
            } catch (e) {
                results.push({ name: r.name, ok: false, msg: e.message });
            }
            await new Promise(resolve => setTimeout(resolve, 1100));
        }

        // ② 매도 전송 후 보유내역 재조회 → 최신 매수가능금액 확인 (매도 체결 여부와 무관하게 진행)
        if (buyRows.length > 0) {
            statusEl.textContent = '매도 완료 후 매수가능금액 확인 중...';
            await handleFetchHoldings(true);
        }

        // ③ 주문가능현금(ord_alowa, 증거금율 반영) 범위 안에서 추천 순위 높은 종목부터 매수
        const addInvestForOrder = (pendingAddOrders && pendingAddOrders.length > 0)
            ? (parseFloat((document.getElementById('additional-investment-input')?.value || '').replace(/,/g, '')) || 0)
            : 0;
        let availableCash = (holdingsAccountInfo ? (holdingsAccountInfo.ordAlowa || holdingsAccountInfo.cash) : 0) + addInvestForOrder;
        for (const r of buyRows) {
            const targetQty = Math.abs(r.diff);
            // kt00010으로 수수료 포함 정확한 주문가능수량 조회, 실패 시 직접 계산으로 fallback
            let affordableQty = Math.floor(availableCash / r.price);
            try {
                const qtyResp = await fetch(`${ORDER_SERVER_URL}/api/order_possible_qty?stk_cd=${r.code}&price=${r.price}&trde_tp=2`);
                const qtyData = await qtyResp.json();
                if (!qtyData.error && qtyData.max_qty > 0) affordableQty = qtyData.max_qty;
            } catch (e) { /* fallback 사용 */ }
            const actualQty = Math.min(targetQty, affordableQty);
            if (actualQty <= 0) {
                results.push({ name: r.name, ok: false, msg: `자금 부족 건너뜀 (필요 ${formatNumber(r.price)}원/주 / 가용 ${formatNumber(Math.round(availableCash))}원)` });
                continue;
            }
            const cost = actualQty * r.price;
            const partialNote = actualQty < targetQty ? ` (목표 ${targetQty}주 중 ${actualQty}주만)` : '';
            statusEl.textContent = `매수 전송 중... (${results.length + 1}/${finalRows.length}) ${r.name}${partialNote}`;
            try {
                const resp = await fetch(`${ORDER_SERVER_URL}/api/order`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ stk_cd: r.code, qty: actualQty, side: 'buy', price: r.price }),
                });
                const data = await resp.json();
                const ok = !(data.error || (data.return_code !== undefined && data.return_code !== 0));
                results.push({ name: r.name, ok, msg: ok ? `성공${partialNote}` : (data.error || data.return_msg) });
                if (ok) availableCash -= cost;
            } catch (e) {
                results.push({ name: r.name, ok: false, msg: e.message });
            }
            await new Promise(resolve => setTimeout(resolve, 1100));
        }

        const successCount = results.filter(r => r.ok).length;
        const skippedCount = results.filter(r => !r.ok && r.msg.includes('건너뜀')).length;
        statusEl.textContent = `✅ 일괄 주문 완료: 성공 ${successCount}/${finalRows.length}건`
            + (skippedCount > 0 ? ` / 자금부족 건너뜀 ${skippedCount}건` : '')
            + (results.filter(r => !r.ok && !r.msg.includes('건너뜀')).length > 0
                ? ` (실패: ${results.filter(r => !r.ok && !r.msg.includes('건너뜀')).map(r => `${r.name}(${r.msg})`).join(', ')})` : '');
        await handleFetchHoldings();

        // 주문 완료 텔레그램 알림
        if (successCount > 0) {
            const orderLines = results.map(r => `${r.ok ? '✅' : '❌'} ${r.name}: ${r.msg}`).join('\n');
            fetch(`${ORDER_SERVER_URL}/api/notify`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: `🛒 일괄 주문 완료 (${new Date().toLocaleTimeString()})\n성공 ${successCount}/${finalRows.length}건\n\n${orderLines}` }),
            }).catch(() => {});
        }

        // 주문 완료 후 성과추적 기준점 자동저장
        if (successCount > 0 && portfolioNames.length > 0) {
            try {
                const baselineStocks = portfolioNames.map(name => {
                    const code = findStockCode(name);
                    const held = code ? holdingsByCode[code] : null;
                    return { name, code, qty: held ? held.qty : 0, price: held ? held.price : findStockPrice(name) };
                }).filter(s => s.code);
                await fetch(`${ORDER_SERVER_URL}/api/performance/baseline`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ stocks: baselineStocks, totalInvestment: holdingsAccountInfo?.totalAsset }),
                });
                statusEl.textContent += ' / 📊 성과추적 기준점 자동저장 완료';
            } catch (e) {
                // 기준점 저장 실패는 치명적이지 않으므로 무시
            }
        }
    }

    function renderOrderTable() {
        renderPortfolioSummary();
        renderOpenOrdersSection();
        if (!holdingsLoaded) {
            document.getElementById("quant-table").innerHTML = holdingsRequiredPlaceholderHtml();
            document.getElementById("order-summary").innerText = '';
            document.getElementById("open-orders-section").style.display = 'none';
            return;
        }

        if (portfolioNames.length === 0) {
            document.getElementById("quant-table").innerHTML =
                `<tbody><tr><td style="padding:30px; color:#dc2626; text-align:center;">⚠️ 목표종목이 비어있습니다. 보유종목 전부가 매도 대상으로 보일 수 있으니,<br>먼저 <b>포트폴리오 설정 메뉴</b>에서 "🔄 선택종목/보유내역 가져오기"를 눌러주세요.</td></tr></tbody>`;
            document.getElementById("order-summary").innerText = '';
            document.getElementById("open-orders-section").style.display = 'none';
            return;
        }

        // 추가 투자 모드 배너
        const banner = document.getElementById('order-mode-banner');
        if (banner) banner.style.display = (pendingAddOrders && pendingAddOrders.length > 0) ? 'block' : 'none';

        // pendingAddOrders가 있으면 추가 투자 모드, 없으면 교체 모드
        let rows;
        if (pendingAddOrders && pendingAddOrders.length > 0) {
            rows = pendingAddOrders.map(o => ({
                name: o.name, code: o.code, price: o.price, side: o.side,
                diff: o.qty, curQty: (holdingsByCode[o.code] ? holdingsByCode[o.code].qty : 0),
                targetQty: (holdingsByCode[o.code] ? holdingsByCode[o.code].qty : 0) + o.qty,
                weightDiffPct: 0, isAddOrder: true,
            }));
        } else {
            // 매도(diff<0)를 위쪽에 먼저 보여줘서, 실제 전송 순서(매도 먼저→현금 확보→매수)와 화면이 일치하도록 함
            rows = computeOrderData().sort((a, b) => (a.diff < 0 ? 0 : 1) - (b.diff < 0 ? 0 : 1));
        }
        let html = `
            <thead>
                <tr>
                    <th style="width: 15%;">종목명</th>
                    <th style="width: 10%;">현재가</th>
                    <th style="width: 10%;">보유수량</th>
                    <th style="width: 10%;">목표수량</th>
                    <th style="width: 12%;">목표비중차이</th>
                    <th style="width: 14%;">매수/매도</th>
                    <th style="width: 14%;">주문</th>
                </tr>
            </thead>
            <tbody>`;

        if (rows.length === 0) {
            html += `<tr><td colspan="7" style="padding:20px; color:#94a3b8;">위에서 종목 선택/투자금을 먼저 설정해주세요.</td></tr>`;
        } else {
            rows.forEach(r => {
                const diffLabel = r.diff > 0 ? `<span style="color:#dc2626;">매수 ${r.diff}주</span>`
                    : r.diff < 0 ? `<span style="color:#2563eb;">매도 ${Math.abs(r.diff)}주</span>`
                    : '-';
                const weightLabel = Math.abs(r.weightDiffPct) >= WEIGHT_DEVIATION_ALERT_PCT
                    ? `<span style="color:#dc2626; font-weight:bold;">${r.weightDiffPct > 0 ? '+' : ''}${r.weightDiffPct.toFixed(1)}%</span>`
                    : `${r.weightDiffPct > 0 ? '+' : ''}${r.weightDiffPct.toFixed(1)}%`;
                const orderBtn = r.diff !== 0
                    ? `<button class="mode-btn action-btn ${r.side === 'buy' ? 'action-btn-red' : 'action-btn-skyblue'}" style="padding:4px 8px; font-size:10px;" onclick="handleSendOrder('${r.code}')">${r.side === 'buy' ? '매수' : '매도'} 전송</button>`
                    : `<span style="display:inline-block; padding:4px 8px; font-size:10px;">-</span>`;
                html += `<tr>
                    <td>${getNameHtml(r.name)}</td>
                    <td>${formatNumber(r.price)}원</td>
                    <td>${formatNumber(r.curQty)}주</td>
                    <td>${formatNumber(r.targetQty)}주</td>
                    <td>${weightLabel}</td>
                    <td>${diffLabel}</td>
                    <td>${orderBtn}</td>
                </tr>`;
            });
        }
        html += `</tbody>`;
        document.getElementById("quant-table").innerHTML = html;

        const buyRows = rows.filter(r => r.diff > 0);
        const sellRows = rows.filter(r => r.diff < 0);
        const buyTotal = buyRows.reduce((sum, r) => sum + r.diff * r.price, 0);
        const sellTotal = sellRows.reduce((sum, r) => sum + Math.abs(r.diff) * r.price, 0);

        // 키움 온라인 기준 수수료/세금 (2025년~ 기준)
        const COMMISSION_RATE = 0.00015;   // 매매수수료 0.015% (매수·매도 공통)
        const TX_RATE = 0.0015;            // 거래세 0.15% (매도 시만)
        const estSellTax = Math.round(sellTotal * TX_RATE);
        const estSellComm = Math.round(sellTotal * COMMISSION_RATE);
        const estBuyComm = Math.round(buyTotal * COMMISSION_RATE);
        const estTotalCost = estSellTax + estSellComm + estBuyComm;

        const addInvest = (pendingAddOrders && pendingAddOrders.length > 0)
            ? (parseFloat((document.getElementById('additional-investment-input')?.value || '').replace(/,/g, '')) || 0)
            : 0;
        const cash = (holdingsAccountInfo ? holdingsAccountInfo.cash : 0) + addInvest;
        const availableAfterSell = cash + sellTotal - estTotalCost;
        const finalBalance = availableAfterSell - buyTotal;

        const chip = (label, value, color) =>
            `<span class="summary-chip">
                <span class="summary-chip-label">${label}</span>
                <span class="summary-chip-value"${color ? ` style="color:${color};"` : ''}>${value}</span>
            </span>`;

        document.getElementById("order-summary").innerHTML = `
            <span class="summary-chips" style="margin-top:0; margin-bottom:4px;">
                ${chip('① 매도', `${sellRows.length}종목 · ${formatNumber(sellTotal)}원`, '#2563eb')}
                ${chip('② 매수', `${buyRows.length}종목 · ${formatNumber(buyTotal)}원`, '#dc2626')}
            </span>
            <span class="summary-chips" style="margin-top:0;">
                ${chip('가용자금', `현금 ${formatNumber(cash)} + 매도 ${formatNumber(sellTotal)} − 비용 ${formatNumber(estTotalCost)} = ${formatNumber(availableAfterSell)}원`)}
                ${chip('매수 후 잔액', `${formatNumber(Math.round(finalBalance))}원`, finalBalance < 0 ? '#dc2626' : null)}
                ${chip('거래비용', `거래세 ${formatNumber(estSellTax)} + 수수료 ${formatNumber(estSellComm + estBuyComm)} = ${formatNumber(estTotalCost)}원`)}
            </span>`;
    }

    // ===== 성과추적 메뉴 =====
    // 보유 내역을 조회해둔 상태면 "실제 체결된 보유종목" 기준으로, 아니면 포트폴리오 목표 기준으로 기준점을 만든다.
    // (리밸런싱 직후 바로 기록하면 실제 체결가가 아닌 목표가가 들어가므로, 주문 실행 후 기록하는 것을 권장)
    function buildBaselinePayload() {
        const recommendList = computeRecommendData();
        const ranksByName = new Map(recommendList.map(r => [r.name, r.ranks]));
        const usingHoldings = holdingsLoaded && Object.values(holdingsByCode).some(h => h.qty > 0);

        let stocks;
        if (usingHoldings) {
            stocks = Object.entries(holdingsByCode)
                .filter(([, h]) => h.qty > 0)
                .map(([code, h]) => ({ name: h.name, code, qty: h.qty, price: h.price, strategyRanks: ranksByName.get(h.name) || {} }));
        } else {
            stocks = computePortfolioData().filter(s => s.shares > 0)
                .map(s => ({ name: s.name, code: findStockCode(s.name), qty: s.shares, price: s.price, strategyRanks: ranksByName.get(s.name) || {} }))
                .filter(s => s.code);
        }
        const totalInvestment = usingHoldings ? stocks.reduce((sum, s) => sum + s.qty * s.price, 0) : portfolioInvestment;
        stocks.forEach(s => { s.weight = totalInvestment > 0 ? (s.qty * s.price) / totalInvestment : null; });
        return { totalInvestment, stocks, usingHoldings };
    }

    async function handleRecordBaseline() {
        const statusEl = document.getElementById('performance-status');
        const payload = buildBaselinePayload();
        if (payload.stocks.length === 0) {
            statusEl.textContent = '기록할 종목이 없습니다. 보유 내역을 조회하거나 포트폴리오 목표를 먼저 설정해주세요.';
            return;
        }
        const sourceLabel = payload.usingHoldings ? '실제 보유 내역' : '포트폴리오 목표(보유 내역 미조회)';
        if (!confirm(`${sourceLabel} 기준으로 ${payload.stocks.length}종목을 성과추적 기준점으로 기록합니다.\n계속하시겠습니까?`)) return;
        statusEl.textContent = '기록 중...';
        try {
            const resp = await fetch(`${ORDER_SERVER_URL}/api/performance/baseline`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
            });
            const data = await resp.json();
            if (data.error) throw new Error(data.error);
            statusEl.textContent = `✅ 기준점 기록 완료 (${data.date}, ${sourceLabel} 기준)`;
            renderPerformanceTable();
        } catch (e) {
            statusEl.textContent = `❌ 로컬 주문 서버 연결 실패 - ${e.message}`;
        }
    }

    async function handleSaveSnapshot() {
        const statusEl = document.getElementById('performance-status');
        statusEl.textContent = '스냅샷 저장 중...';
        try {
            const resp = await fetch(`${ORDER_SERVER_URL}/api/performance/snapshot`, { method: 'POST' });
            const data = await resp.json();
            if (data.error) throw new Error(data.error);
            statusEl.textContent = `✅ 스냅샷 저장 완료 (${data.datetime})`;
            renderPerformanceTable();
        } catch (e) {
            statusEl.textContent = `❌ 스냅샷 저장 실패 - ${e.message}`;
        }
    }

    function pctLabel(v) {
        if (v == null || isNaN(v)) return '-';
        const color = v > 0 ? '#dc2626' : (v < 0 ? '#2563eb' : '#64748b');
        return `<span style="color:${color};">${v > 0 ? '+' : ''}${v.toFixed(2)}%</span>`;
    }

    async function renderPerformanceTable() {
        const statusEl = document.getElementById('performance-status');
        let history;
        try {
            const resp = await fetch(`${ORDER_SERVER_URL}/api/performance/history`);
            history = await resp.json();
        } catch (e) {
            document.getElementById("quant-table").innerHTML =
                `<tbody><tr><td style="padding:30px; color:#94a3b8;">로컬 주문 서버에 연결할 수 없습니다. (python order_server.py 실행 필요)</td></tr></tbody>`;
            return;
        }
        if (!history.baselines || history.baselines.length === 0) {
            document.getElementById("quant-table").innerHTML =
                `<tbody><tr><td style="padding:30px; color:#94a3b8;">"① 기준점 기록" 버튼을 눌러 추적을 시작해주세요.</td></tr></tbody>`;
            return;
        }

        // 기준점 드롭다운 채우기
        const selector = document.getElementById('baseline-selector');
        const prevVal = selector.value;
        selector.innerHTML = history.baselines.map((b, i) =>
            `<option value="${i}">${b.date} (${formatNumber(b.totalInvestment || 0)}원, ${b.stocks.length}종목)</option>`
        ).join('');
        // 기본 선택: 이전 선택값 유지 or tracking_start_date 일치 or 마지막
        const trackingDate = (history.tracking_start_date || '').replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3');
        let defaultIdx = history.baselines.length - 1;
        if (!prevVal) {
            const tdIdx = history.baselines.findIndex(b => b.date === trackingDate);
            if (tdIdx >= 0) defaultIdx = tdIdx;
        }
        selector.value = prevVal || String(defaultIdx);
        const selIdx = parseInt(selector.value, 10);
        const baseline = history.baselines[selIdx] || history.baselines[history.baselines.length - 1];
        const lastSnapshot = baseline.snapshots && baseline.snapshots.length > 0 ? baseline.snapshots[baseline.snapshots.length - 1] : null;
        const baselineTotal = baseline.stocks.reduce((sum, s) => sum + (s.price * s.qty), 0);

        // 총평가금액 / 누계 수익률 요약 카드
        let summaryHtml = '';
        try {
            const sumResp = await fetch(`${ORDER_SERVER_URL}/api/performance/summary`);
            const sum = await sumResp.json();
            if (!sum.error) {
                const profit = sum.profit;
                const pct = sum.profit_pct;
                const profitColor = profit >= 0 ? '#dc2626' : '#2563eb';
                const baseDtLabel = sum.base_dt ? sum.base_dt.replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3') : '-';
                summaryHtml = `<div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:14px 18px; margin-bottom:16px; display:flex; gap:32px; flex-wrap:wrap;">
                    <div><div style="font-size:11px; color:#64748b; margin-bottom:2px;">기준일 자산 (${baseDtLabel})</div><div style="font-size:15px; font-weight:600;">${formatNumber(sum.base_asset || 0)}원</div></div>
                    <div><div style="font-size:11px; color:#64748b; margin-bottom:2px;">총평가금액</div><div style="font-size:18px; font-weight:700;">${formatNumber(sum.total_asset)}원</div></div>
                    <div><div style="font-size:11px; color:#64748b; margin-bottom:2px;">총순입금 (${baseDtLabel} 이후)</div><div style="font-size:18px; font-weight:700;">${formatNumber(sum.net_in)}원</div></div>
                    <div><div style="font-size:11px; color:#64748b; margin-bottom:2px;">수익금액 / 수익률</div><div style="font-size:18px; font-weight:700; color:${profitColor};">${profit >= 0 ? '+' : ''}${formatNumber(profit)}원 (${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%)</div></div>
                    ${sum.invt_bsamt ? `<div><div style="font-size:11px; color:#64748b; margin-bottom:2px;">투자원금평잔</div><div style="font-size:14px; font-weight:600;">${formatNumber(sum.invt_bsamt)}원</div></div>` : ''}
                    ${sum.tern_rt != null ? `<div><div style="font-size:11px; color:#64748b; margin-bottom:2px;">회전율</div><div style="font-size:14px; font-weight:600;">${sum.tern_rt.toFixed(2)}%</div></div>` : ''}
                </div>`;
            }
        } catch (e) {}

        let html = `<tbody><tr><td style="padding:14px; text-align:left;">${summaryHtml}`;

        // 기준점 정보 + ③ 수익률
        html += `<div style="margin-bottom:14px;"><b>① 기준점</b> (${baseline.date}) - 투자금 ${formatNumber(baseline.totalInvestment || baselineTotal)}원, ${baseline.stocks.length}종목</div>`;

        if (lastSnapshot) {
            const portfolioReturn = baselineTotal > 0 ? ((lastSnapshot.totalValue - baselineTotal) / baselineTotal) * 100 : null;
            const kospiReturn = (baseline.benchmark.kospi && lastSnapshot.benchmark.kospi)
                ? ((lastSnapshot.benchmark.kospi - baseline.benchmark.kospi) / baseline.benchmark.kospi) * 100 : null;
            const kosdaqReturn = (baseline.benchmark.kosdaq && lastSnapshot.benchmark.kosdaq)
                ? ((lastSnapshot.benchmark.kosdaq - baseline.benchmark.kosdaq) / baseline.benchmark.kosdaq) * 100 : null;

            html += `<div style="margin-bottom:14px;"><b>③ 수익률</b> (최근 스냅샷: ${lastSnapshot.datetime})<br>
                포트폴리오 전체: ${pctLabel(portfolioReturn)} (평가금액 ${formatNumber(lastSnapshot.totalValue)}원)<br>
                KOSPI(KODEX200 근사): ${pctLabel(kospiReturn)} / KOSDAQ(KODEX코스닥150 근사): ${pctLabel(kosdaqReturn)}</div>`;

            html += `<table style="width:100%; font-size:11px; margin-bottom:14px;"><thead><tr>
                <th>종목명</th><th>매수가</th><th>현재가</th><th>수량</th><th>개별 수익률</th></tr></thead><tbody>`;
            baseline.stocks.forEach(s => {
                const sv = lastSnapshot.stocks.find(x => x.code === s.code);
                const ret = (sv && sv.price && s.price) ? ((sv.price - s.price) / s.price) * 100 : null;
                html += `<tr><td>${s.name}</td><td>${formatNumber(s.price)}</td><td>${sv && sv.price ? formatNumber(sv.price) : '-'}</td><td>${formatNumber(s.qty)}주</td><td>${pctLabel(ret)}</td></tr>`;
            });
            html += `</tbody></table>`;

            // ④ 전략별 기여도
            const strategyStats = {};
            baseline.stocks.forEach(s => {
                const sv = lastSnapshot.stocks.find(x => x.code === s.code);
                const ret = (sv && sv.price && s.price) ? ((sv.price - s.price) / s.price) * 100 : null;
                if (ret == null) return;
                Object.keys(s.strategyRanks || {}).forEach(key => {
                    if (!strategyStats[key]) strategyStats[key] = [];
                    strategyStats[key].push(ret);
                });
            });
            html += `<div style="margin-bottom:6px;"><b>④ 전략별 기여도</b> (해당 전략이 추천했던 보유종목들의 평균 수익률)</div>`;
            html += `<table style="width:100%; font-size:11px; margin-bottom:14px;"><thead><tr><th>전략</th><th>해당 종목수</th><th>평균 수익률</th></tr></thead><tbody>`;
            const strategyNameMap = Object.fromEntries(STRATEGIES.map(s => [s.key, `${s.num}. ${s.name}`]));
            Object.entries(strategyStats)
                .sort((a, b) => (b[1].reduce((s, v) => s + v, 0) / b[1].length) - (a[1].reduce((s, v) => s + v, 0) / a[1].length))
                .forEach(([key, rets]) => {
                    const avg = rets.reduce((s, v) => s + v, 0) / rets.length;
                    html += `<tr><td>${strategyNameMap[key] || key}</td><td>${rets.length}</td><td>${pctLabel(avg)}</td></tr>`;
                });
            html += `</tbody></table>`;
        } else {
            html += `<div style="margin-bottom:14px; color:#94a3b8;">"② 오늘 스냅샷 저장"을 눌러 수익률 추적을 시작해주세요.</div>`;
        }

        // ⑤ 리밸런싱 전후 비교
        if (baseline.previousComparison) {
            const pc = baseline.previousComparison;
            html += `<div style="margin-bottom:6px; display:flex; align-items:center; gap:8px;">
                <b>⑤ 직전 기준점 대비 리밸런싱 효과</b>
                <button class="mode-btn action-btn action-btn-blue" style="padding:2px 8px; font-size:10px;"
                    onclick="handleFetchRealizedPL('${baseline.date}')">📊 실제 실현손익 조회</button>
            </div>`;
            html += `<table style="width:100%; font-size:11px;" id="realized-pl-table"><thead><tr>
                <th>구분</th><th>종목명</th><th>보유 중 수익률</th><th>실현손익</th><th>실제 비용</th>
            </tr></thead><tbody>`;
            pc.kept.forEach(s => html += `<tr><td>유지</td><td>${s.name}</td><td>${pctLabel(s.return_pct)}</td><td>-</td><td>-</td></tr>`);
            pc.removed.forEach(s => html += `<tr data-code="${s.code}"><td style="color:#2563eb;">교체(제외)</td><td>${s.name}</td><td>${pctLabel(s.return_pct)}</td><td class="realized-pl">-</td><td class="realized-cost">-</td></tr>`);
            pc.added.forEach(s => html += `<tr><td style="color:#dc2626;">신규 추가</td><td>${s.name}</td><td>-</td><td>-</td><td>-</td></tr>`);
            html += `</tbody></table>`;
        }

        html += `</td></tr></tbody>`;
        document.getElementById("quant-table").innerHTML = html;
    }

    async function handleFetchRealizedPL(baselineDate) {
        const table = document.getElementById('realized-pl-table');
        if (!table) return;
        const rows = table.querySelectorAll('tr[data-code]');
        if (!rows.length) { alert('교체(제외) 종목이 없습니다.'); return; }
        const fromDt = (baselineDate || '').replace(/-/g, '');
        for (const row of rows) {
            const code = row.dataset.code;
            const plCell = row.querySelector('.realized-pl');
            const costCell = row.querySelector('.realized-cost');
            if (!code || !plCell || !costCell) continue;
            plCell.textContent = '조회 중…';
            costCell.textContent = '';
            try {
                const resp = await fetch(`${ORDER_SERVER_URL}/api/realized_pl?code=${code}&from=${fromDt}`);
                const data = await resp.json();
                if (data.error) { plCell.textContent = '오류'; continue; }
                const rows2 = data.dt_stk_div_rlzt_pl || [];
                let totalPl = 0, totalCost = 0;
                rows2.forEach(r => {
                    totalPl += parseInt(r.tdy_sel_pl || '0', 10);
                    totalCost += parseInt(r.tdy_trde_cmsn || '0', 10) + parseInt(r.tdy_trde_tax || '0', 10);
                });
                plCell.textContent = formatNumber(totalPl) + '원';
                plCell.style.color = totalPl >= 0 ? '#dc2626' : '#2563eb';
                costCell.textContent = formatNumber(totalCost) + '원';
            } catch (e) {
                plCell.textContent = '오류';
                costCell.textContent = '';
            }
        }
    }

    function sortData(key) {
        if (currentMenu === 'recommend') {
            if (recommendDataCache.length === 0) return;
            if (currentSortKey === key) { isAscending = !isAscending; }
            else { currentSortKey = key; isAscending = true; }
            recommendDataCache.sort((a, b) => {
                if (typeof a[key] === 'string') return isAscending ? a[key].localeCompare(b[key]) : b[key].localeCompare(a[key]);
                return isAscending ? a[key] - b[key] : b[key] - a[key];
            });
            renderRecommendTable(filterBySearch(recommendDataCache));
            return;
        }

        let targetDataset = [];
        if (currentMenu === 'fscore') targetDataset = fscoreData;
        else if (currentMenu === 'strategy15') targetDataset = qualityData;
        else if (currentMenu === 'strategy16') targetDataset = famaData;
        else if (currentMenu === 'strategy18') targetDataset = superQualityData;
        else if (currentMenu === 'strategy19') targetDataset = valueMomentumData;
        else if (currentMenu === 'strategy20') targetDataset = qualityMomentumData;
        else if (currentMenu === 'strategy21') targetDataset = pickSmallcapData(ultraSmallcapMode, ultraData, ultraSmallcapData, ultraSmallcap30Data);
        else if (currentMenu === 'momentum') targetDataset = pickSmallcapData(momentumSmallcapMode, momentumData, momentumSmallcapData, momentumSmallcap30Data);
        else if (currentMenu === 'super') targetDataset = pickSmallcapData(smallcapMode, superData, superSmallcapData, superSmallcap30Data);
        else if (currentMenu === 'ncav') targetDataset = ncavData;
        
        if (targetDataset.length === 0) return;
        if (currentSortKey === key) { isAscending = !isAscending; } 
        else { currentSortKey = key; isAscending = true; }
        
        targetDataset.sort((a, b) => {
            if (typeof a[key] === 'string') return isAscending ? a[key].localeCompare(b[key]) : b[key].localeCompare(a[key]);
            return isAscending ? a[key] - b[key] : b[key] - a[key];
        });
        
        refreshCurrentTable();
    }

    window.onload = function() {
        loadOptions();
        updateBookmarkCount();
        if ('Notification' in window) {
            const btn = document.getElementById('btn-enable-notif');
            if (btn && Notification.permission === 'granted') btn.textContent = '🔔 알림 켜짐';
            if (btn && Notification.permission === 'denied') btn.textContent = '🔕 알림 꺼짐 (차단됨)';
        }
        if (typeof KOSPI_QUANT_PACKAGE !== 'undefined') {
            const server = KOSPI_QUANT_PACKAGE.server;
            superData = KOSPI_QUANT_PACKAGE.super_value;
            superSmallcapData = KOSPI_QUANT_PACKAGE.super_value_smallcap;
            superSmallcap30Data = KOSPI_QUANT_PACKAGE.super_value_smallcap30 || [];
            momentumData = KOSPI_QUANT_PACKAGE.momentum_value;
            momentumSmallcapData = KOSPI_QUANT_PACKAGE.momentum_value_smallcap;
            momentumSmallcap30Data = KOSPI_QUANT_PACKAGE.momentum_value_smallcap30 || [];
            fscoreData = KOSPI_QUANT_PACKAGE.fscore_value;
            qualityData = KOSPI_QUANT_PACKAGE.quality_value;
            famaData = KOSPI_QUANT_PACKAGE.fama_value;
            superQualityData = KOSPI_QUANT_PACKAGE.super_quality_value;
            valueMomentumData = KOSPI_QUANT_PACKAGE.value_momentum_value;
            qualityMomentumData = KOSPI_QUANT_PACKAGE.quality_momentum_value;
            ultraData = KOSPI_QUANT_PACKAGE.ultra_value;
            ultraSmallcapData = KOSPI_QUANT_PACKAGE.ultra_value_smallcap;
            ultraSmallcap30Data = KOSPI_QUANT_PACKAGE.ultra_value_smallcap30 || [];
            stockFlags = KOSPI_QUANT_PACKAGE.stock_flags || {};
            stockMetrics = KOSPI_QUANT_PACKAGE.stock_metrics || {};
            ncavData = KOSPI_QUANT_PACKAGE.ncav_value;

            document.getElementById("data-date-view").innerHTML =
                `📅 공공데이터 ${server.krx_basis_date} · DART ${server.dart_basis}`;
            switchMenu('recommend');
        }
    };
</script>
</body>
